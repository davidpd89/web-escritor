  <h1>Legibilidad (Inflesz, Fernández-Huerta)</h1>
  <form data-readability-form>
    <label for="readability-input">Pega un texto</label>
    <textarea id="readability-input" data-readability-input></textarea>
    <div><button type="submit">Analizar</button><button type="button" data-readability-sample>Cargar ejemplo</button><button type="button" data-readability-clear>Borrar</button></div>
    <p id="readability-status" data-readability-status>El texto no sale del navegador.</p>
  </form>
  <section data-readability-results hidden>
    <div data-summary></div>
    <div data-metrics></div>
    <div data-density-strip></div>
    <ol data-dense></ol>
    <ol data-longest></ol>
  </section>
