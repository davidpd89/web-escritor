  <h1>Comprobador de nombres de personaje</h1>
  <form>
    <label for="names">Lista de nombres (una por línea, o separados por comas)</label>
    <textarea id="names" data-names-input></textarea>
    <div>
      <button type="submit">Analizar</button>
      <button type="button" id="clear" data-clear>Limpiar</button>
    </div>
    <p id="summary" data-summary role="status" aria-live="polite">Introduce al menos dos nombres para analizar.</p>
  </form>
  <section id="results" data-results aria-live="polite"></section>
</main>
<!-- defer es obligatorio, no decorativo: sin él este script clásico se
     ejecutaba de forma síncrona durante el parseo, ANTES de que el <script
     type="module"> de arriba (diferido por defecto) definiera
     window.DPCharacterNames. La guarda de nombres-personajes.js
     ("if (!window.DPCharacterNames) return;") se cumplía siempre y el
     formulario se quedaba sin manejador de submit: el botón "Analizar" no
     hacía nada, en ningún navegador, nunca. Confirmado en vivo por CDP antes
     y después del cambio. -->
<script type="module" src="/assets/nombres-personajes-engine-compat.js"></script>
<script src="/assets/nombres-personajes.js" defer></script>
