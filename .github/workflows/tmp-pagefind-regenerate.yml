name: Temporary Pagefind regeneration

on:
  push:
    branches:
      - fix/autor-lead-font-stable-measure
    paths:
      - '.github/workflows/tmp-pagefind-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install locked Pagefind dependency
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Regenerate Pagefind
        run: python scripts/build-pagefind-index.py

      - name: Commit generated Pagefind only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind/
          if git diff --cached --quiet; then
            echo "Pagefind already current."
            exit 0
          fi
          git commit -m "chore(search): regenerate Pagefind index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
