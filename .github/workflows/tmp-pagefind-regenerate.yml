name: Temporary Pagefind regeneration

on:
  push:
    branches:
      - qa/postdeploy-metadata-artifacts-20261005
    paths:
      - '.github/workflows/tmp-pagefind-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/postdeploy-metadata-artifacts-20261005
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm ci
      - name: Regenerate Pagefind with the official builder
        run: python scripts/build-pagefind-index.py
      - name: Verify Pagefind is current
        run: python scripts/build-pagefind-index.py --check
      - name: Commit generated Pagefind artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pagefind; then
            echo "Pagefind was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind
          git commit -m "chore: regenerate Pagefind index"
          git push origin HEAD:qa/postdeploy-metadata-artifacts-20261005
