name: Temporary Pagefind regeneration

on:
  push:
    branches:
      - fix/print-intro-production-20261005
    paths:
      - '.github/workflows/tmp-pagefind-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/print-intro-production-20261005
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Pagefind toolchain
        run: npm ci

      - name: Regenerate Pagefind from current HTML
        run: python scripts/build-pagefind-index.py

      - name: Remove temporary workflow and commit generated output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pagefind-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind .github/workflows/tmp-pagefind-regenerate.yml
          if git diff --cached --quiet; then
            echo "No generated Pagefind changes found." >&2
            exit 1
          fi
          git commit -m "chore: regenerate Pagefind after home asset version bump"
          git push origin HEAD:fix/print-intro-production-20261005
