name: Sitewide console errors QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'script.js'
      - 'data/content-registry.json'
      - 'scripts/build-public-dist.py'
      - 'qa/sitewide-console-errors-browser.mjs'
      - '.github/workflows/sitewide-console-errors-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitewide-console-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run sitewide console-error audit
        run: node qa/sitewide-console-errors-browser.mjs
