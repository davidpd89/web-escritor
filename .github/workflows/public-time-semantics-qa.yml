name: Public time semantics QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'data/content-registry.json'
      - 'scripts/check-public-time-semantics.py'
      - '.github/workflows/public-time-semantics-qa.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/content-registry.json'
      - 'scripts/check-public-time-semantics.py'
      - '.github/workflows/public-time-semantics-qa.yml'
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-time-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public temporal semantics
        run: python scripts/check-public-time-semantics.py
