name: Atlas contract offline tests

on:
  pull_request:
    paths:
      - 'schemas/atlas/**'
      - 'scripts/atlas_contract_check.py'
      - 'tests/test_atlas_contract_*.py'
      - 'docs/atlas-contract/**'
      - '.github/workflows/atlas-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the Draft 2020-12 reference validator
        run: python -m pip install 'jsonschema==4.26.0'
      - name: Verify syntax
        run: python -m compileall -q scripts/atlas_contract_check.py tests/test_atlas_contract_check.py tests/test_atlas_contract_schema.py
      - name: Run schema and gate tests — no network, no secrets
        run: python -m unittest discover -s tests -p 'test_atlas_contract_*.py' -v
