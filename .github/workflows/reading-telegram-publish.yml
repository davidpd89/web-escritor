name: Reading Telegram publish

on:
  schedule:
    # El día sale a las 11:30 de Madrid (09:30 UTC en verano, 10:30 UTC en invierno); antes de esa hora
    # el ciclo no hace nada. Los ciclos de cada cuarto de hora recogen lo que quede pendiente.
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ['Reading catalogue intake']
    types: [completed]
  workflow_dispatch:
    inputs:
      test_asin:
        description: 'Optional labelled example edition; independent delivery history'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: reading-telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: vars.READING_TELEGRAM_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-telegram.txt
      - name: Cache period
        id: clock
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/reading-telegram/editorial-cache
          key: telegram-editorial-v1-${{ steps.clock.outputs.hour }}
          restore-keys: telegram-editorial-v1-
      - name: Configure private runtime
        env:
          CHANNELS_JSON: ${{ secrets.READING_TELEGRAM_CHANNELS_JSON }}
          BOT_TOKEN: ${{ secrets.READING_TELEGRAM_BOT_TOKEN }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'reading-telegram'
          root.mkdir(parents=True, exist_ok=True)
          config = json.loads(os.environ['CHANNELS_JSON'])
          assert config.get('enabled') is True and config.get('demo') is False
          (root / 'channels.json').write_text(json.dumps(config), encoding='utf-8')
          token = os.environ['BOT_TOKEN'].strip()
          assert token
          (root / 'bot-token.txt').write_text(token, encoding='utf-8')
      - name: Verify editions and publish with durable checkpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READING_TELEGRAM_STATE_KEY: ${{ secrets.READING_TELEGRAM_STATE_KEY }}
          TEST_ASIN: ${{ inputs.test_asin }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          args = [sys.executable, 'scripts/reading_telegram_worker.py', '--root',
                  str(Path(os.environ['RUNNER_TEMP']) / 'reading-telegram'), '--send', '--github-state']
          if os.environ.get('TEST_ASIN'):
              args += ['--test-asin', os.environ['TEST_ASIN']]
          raise SystemExit(subprocess.call(args))
      - name: Aggregate operational result without private identifiers
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'reading-telegram' / 'last-run.json'
          data = json.loads(path.read_text()) if path.exists() else {'status': 'failed_before_cycle'}
          rows = data.get('deliveries', [])
          counts = {state: sum(row['status'].split(':', 1)[0] == state for row in rows)
                    for state in ['sent', 'skipped', 'uncertain', 'retry', 'rejected']}
          # Por estado completo ("skipped:rejected" = rechazado y ya avisado en un ciclo anterior; no vuelve a poner el ciclo en rojo), sin chats ni ASIN.
          detail = {}
          for row in rows:
              state = 'retry' if row['status'].startswith('retry:') else row['status'].split(':retry:')[0]
              detail[state] = detail.get(state, 0) + 1
          pending_today = [p for p in data.get('verification', {}).get('pending', [])
                           if p.get('release_date') == data.get('at', '')[:10]]
          retrying = [p for p in pending_today if p.get('transient', True)]
          excluded = [p for p in pending_today if not p.get('transient', True)]
          print('Telegram cycle:', data['status'], json.dumps(detail, sort_keys=True),
                'pendientes de verificar hoy:', len(retrying), '| excluidos hoy:', len(excluded))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Telegram cycle: ' + str(data['status']) + '\n\n')
              out.write(json.dumps(counts) + '\n')
              out.write(json.dumps(detail, sort_keys=True) + '\n')
              if excluded:
                  out.write('\nLibros de hoy excluidos (la edición no se puede verificar):\n')
                  for p in excluded:
                      out.write(f"- {p['id']}: {p.get('reason')}\n")
              fixes = data.get('cover_fixes', [])
              if fixes:
                  out.write('\nPortadas tipográficas revisadas al publicar:\n')
                  for fix in fixes[:200]:
                      out.write(f"- {fix.get('title')}: {fix.get('verdict')} ({fix.get('source') or '-'})\n")
              out.write('Durable state is checkpointed per batch of sends. No private runtime artifacts uploaded.\n')
