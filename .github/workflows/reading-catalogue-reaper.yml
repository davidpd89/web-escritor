name: Reading catalogue reaper
# Vigía de cargas muertas. Cuando el runner pierde la comunicación (20/11: «The hosted runner lost communication»)
# o el job llega al límite, los pasos «Close the night turn» y «Retry a failed night batch» de la propia carga no
# corren: el libro de la noche queda con la carga en curso y no se reintenta hasta el siguiente reloj, si lo hay.
# `workflow_run` es un evento, no un cron: GitHub no lo descarta con carga. Solo actúa si el apunte de esa carga sigue en
# curso (scripts/noche.py huerfana); una carga que falló «normal» ya decidió su reintento ella misma.
on:
  workflow_run:
    workflows: ['Reading catalogue intake']
    types: [completed]

permissions:
  contents: read

jobs:
  recoger:
    # Solo ejecuciones en rojo de la carga real sobre main; las canceladas a mano o por el grupo no se reintentan.
    if: contains(fromJSON('["failure","timed_out","cancelled","startup_failure"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && vars.READING_INTAKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # libro de la noche en la rama catalogo-estado
      actions: write    # despacho del reintento
    concurrency:
      group: reading-catalogue-reaper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/noche.py
            scripts/catalogo_estado.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Close a dead load and retry it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUERTA: ${{ github.event.workflow_run.id }}
          INTENTO: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/noche.py huerfana --run-muerto "$MUERTA" --intento-muerto "$INTENTO"; then
            gh workflow run reading-catalogue-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f motivo=reintento
            echo "Carga muerta $MUERTA: reintento despachado." >> "$GITHUB_STEP_SUMMARY"
          fi

  descongelar:
    # Tras cualquier carga terminada, como acabe: las PR que pasó a borrador vuelven si no queda otra en marcha ni en
    # cola (scripts/congelar_main.py). Aquí y no en la carga: también corre si el runner murió o se agotó el tiempo.
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/congelar_main.py
            scripts/gh_listas.py
            scripts/app_token.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unfreeze pull requests
        # Con la App y no con GITHUB_TOKEN (caso R3-01 de GPT, 25/11): el auto-merge que se reactiva fusiona a nombre
        # de quien lo activó, y una fusión de GITHUB_TOKEN no dispara los workflows del push a main (despliegue,
        # main-contratos); además GITHUB_TOKEN no tiene contents: write para fusionar una PR que ya cumple.
        env:
          GITHUB_TOKEN_RESERVA: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPARADOR_APP_ID: ${{ vars.REPARADOR_APP_ID }}
          REPARADOR_APP_INSTALLATION_ID: ${{ vars.REPARADOR_APP_INSTALLATION_ID }}
          REPARADOR_APP_PRIVATE_KEY: ${{ secrets.REPARADOR_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REPARADOR_APP_ID:-}" ] && token="$(node scripts/app_token.mjs)"; then
            export GH_TOKEN="$token"
          else
            echo '::warning::Sin token de la App: se descongela con GITHUB_TOKEN y el auto-merge reactivado no despliega'
            export GH_TOKEN="$GITHUB_TOKEN_RESERVA"
          fi
          python scripts/congelar_main.py descongelar
