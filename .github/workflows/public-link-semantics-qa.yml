name: Public link semantics QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/check-public-link-semantics.py'
      - '.github/workflows/public-link-semantics-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-link-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public link semantics
        run: python scripts/check-public-link-semantics.py
