name: Temporary refresh Pagefind after generated routes

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-pagefind-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild and verify Pagefind
        run: |
          python3 scripts/build-pagefind-index.py
          python3 scripts/build-pagefind-index.py --check
      - name: Commit refreshed index and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pagefind-refresh.yml
          git add pagefind/
          git commit -m "chore(search): index final publisher routes"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
