name: Newsletter consent QA

on:
  pull_request:
    paths:
      - 'script.js'
      - 'assets/v1-shell.js'
      - 'assets/newsletter-popup.js'
      - 'assets/newsletter-popup.css'
      - 'scripts/build-site-shell.py'
      - 'index.html'
      - 'fragmento/**'
      - 'las-manecillas-del-recuerdo/**'
      - 'cuaderno/**'
      - 'privacidad.html'
      - 'tests/test-newsletter-client-contract.mjs'
      - 'qa/newsletter-consent-browser.mjs'
      - '.github/workflows/newsletter-consent-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsletter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Validate newsletter client contract
        run: node tests/test-newsletter-client-contract.mjs

      - name: Validate generated shell parity
        run: python3 scripts/build-site-shell.py --check

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/newsletter-consent-server.log 2>&1 &
          echo $! > /tmp/newsletter-consent-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/cuaderno/que-es-el-portal-fantasy/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/newsletter-consent-server.log
          exit 1

      - name: Run newsletter consent browser contract
        env:
          QA_ORIGIN: http://127.0.0.1:4173
        run: node qa/newsletter-consent-browser.mjs
