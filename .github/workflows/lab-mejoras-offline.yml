name: Laboratorio mejoras - tests offline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - lab/mejoras-web-20261024

permissions:
  contents: read

concurrency:
  group: lab-mejoras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contrato-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar catálogo
        run: python experimentos/mejoras-web/verificar.py
      - name: Ejercitar rotación, fuentes y flujo simulado
        run: python -m unittest discover -s experimentos/mejoras-web -p 'test_*.py' -v
