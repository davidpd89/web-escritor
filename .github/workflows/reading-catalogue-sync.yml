name: Reading catalogue intake

on:
  schedule:
    # Una sola carga nocturna, fuera de la hora en punto (01:17 Madrid en invierno, 02:17 en verano).
    # Si hay más novedades que cupo, la propia carga encadena la siguiente hasta las 06:00 Madrid, y de día
    # Actions queda libre para el código. Hasta el 06/11 había 8 cron diarios que competían con las PR de código.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and validate without changing the website'
        type: boolean
        default: false
      live_provider_pilot:
        description: 'Read-only live ratings/prices pilot; requires dry_run=true and never publishes'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: reading-catalogue-intake
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.madrid.outputs.run }}
    steps:
      - id: madrid
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        # Decided by the cron that fired, not the current hour: a delayed run still counts.
        run: |
          offset=$(TZ=Europe/Madrid date +%z)
          case "$EVENT:$SCHEDULE:$offset" in
            schedule:'17 0 * * *':*|workflow_dispatch:*) echo run=true >> "$GITHUB_OUTPUT" ;;
            *) echo run=false >> "$GITHUB_OUTPUT" ;;
          esac
  intake:
    needs: clock
    if: needs.clock.outputs.run == 'true' && vars.READING_INTAKE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    # Dos ciclos de CI de la PR (~75 min cada uno si main avanza y se traslada la carga) más Pages.
    # 2026-11-05: la ejecución 41937351508 se cortó a los 135 min en el segundo ciclo con 22 libros listos.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned validation and search dependencies
        run: |
          python -m pip install --requirement scripts/requirements.txt
          python -m pip install --requirement scripts/requirements-reading-audio.txt
          npm ci
      - name: Restore public editorial response cache
        uses: actions/cache@v5
        with:
          path: .ci/reading-editorial-cache
          key: reading-editorial-v1-${{ github.run_id }}
          restore-keys: reading-editorial-v1-
      - name: Discover, validate and publish through protected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            python scripts/refresh-reading-catalogue.py
          else
            # Exit 75: main moved while the bot PR was in CI. The second attempt
            # finds that green PR still open and carries its source data (books,
            # pending candidates, prices) onto the new main without querying the
            # sources again; only pages and indices are rebuilt. Branch names
            # come from fresh_branch, so the retry never reuses attempt 1's.
            for attempt in 1 2; do
              rc=0
              python scripts/refresh-reading-catalogue.py --publish || rc=$?
              if [ "$rc" -eq 0 ]; then break; fi
              if [ "$rc" -ne 75 ] || [ "$attempt" -eq 2 ]; then exit "$rc"; fi
              git fetch --quiet origin main
              git switch --quiet --detach origin/main
              git reset --quiet --hard origin/main
              git clean --quiet -fd
            done
          fi
      - name: Chain the next night batch
        # GitHub drops most hourly crons under load (2026-11-04: one scheduled run all night), so a
        # batch that published new books dispatches the next one itself. Night only (00-06 Madrid),
        # so daytime merges from other work never wait behind a load. A batch with nothing new, a
        # resumed PR or a failure stops the chain; the next cron picks up again.
        if: success() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          hour=$(TZ=Europe/Madrid date +%-H)
          accepted=$(python -c "import json,pathlib;p=pathlib.Path('.ci/reading-intake/publisher-report.json');print(json.loads(p.read_text(encoding='utf-8')).get('stats',{}).get('accepted',0) if p.exists() else 0)")
          echo "Madrid hour $hour, accepted $accepted"
          if [ "$hour" -lt 6 ] && [ "$accepted" -gt 0 ]; then
            gh workflow run reading-catalogue-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Next night batch dispatched (accepted $accepted at $hour h Madrid)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read-only live provider pilot
        if: inputs.dry_run && inputs.live_provider_pilot
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: python qa/reading-provider-pilot.py
      - name: Upload factual ingestion report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reading-intake-review
          path: .ci/reading-intake/
          retention-days: 7
          if-no-files-found: warn
      - name: Explain result
        if: always()
        run: echo 'Sources are reviewed official editorial catalogues. Publication requires real CI, main rules and an exact-commit Pages deployment. No LLM or paid API is called. Missing data stays pending.' >> "$GITHUB_STEP_SUMMARY"
