name: Reading catalogue intake
# Los ensayos llevan su propio nombre y no se anotan en el libro de la noche (scripts/noche.py).
run-name: ${{ inputs.dry_run && 'Ensayo sin publicar' || 'Reading catalogue intake' }}

on:
  schedule:
    # Una sola carga nocturna, fuera de la hora en punto (01:17 Madrid en invierno, 02:17 en verano).
    # Si hay más novedades que cupo, la propia carga encadena la siguiente hasta las 06:00 Madrid, y de día
    # Actions queda libre para el código. Hasta el 06/11 había 8 cron diarios que competían con las PR de código.
    - cron: '17 0 * * *'
    # Respaldo: GitHub descarta crons con carga (07/11: el de las 00:17 no saltó y no entró ningún libro) y retrasa
    # otros horas (06/11: uno a las 03:52). Los tres cargan solo si esta noche no hay otra carga en verde según el
    # libro de la noche (scripts/ci_intake_backup.py -> scripts/noche.py); lo que sigue en curso lo resuelve el job
    # intake con el turno del grupo, así un cron retrasado no repite la de un respaldo.
    - cron: '47 1 * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and validate without changing the website'
        type: boolean
        default: false
      live_provider_pilot:
        description: 'Read-only live ratings/prices pilot; requires dry_run=true and never publishes'
        type: boolean
        default: false
      respaldo:
        description: 'Reloj externo (workers/intake-dispatch.mjs): carga solo si esta noche no hay otra en verde ni en curso'
        type: boolean
        default: false
      motivo:
        description: 'Quién lanza la carga: manual, cadena o reintento (lo anotan la cadena y el reintento; scripts/noche.py)'
        type: string
        default: manual

# Escritura solo en el job que carga (Sonar S8233); clock solo lee las ejecuciones de la noche.
permissions:
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 2
    outputs:
      run: ${{ steps.madrid.outputs.run }}
    steps:
      - if: github.event_name == 'schedule' || inputs.respaldo
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci_intake_backup.py
            scripts/noche.py
            scripts/catalogo_estado.py
          sparse-checkout-cone-mode: false
      - id: madrid
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RESPALDO: ${{ inputs.respaldo }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        # Decided by the cron that fired, not the current hour: a delayed run still counts.
        # El dispatch del reloj externo (respaldo=true) decide como un cron: nunca repite una carga en verde o en curso.
        run: |
          case "$EVENT:$RESPALDO:$SCHEDULE" in
            workflow_dispatch:true:*) python3 scripts/ci_intake_backup.py >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch:*) echo run=true >> "$GITHUB_OUTPUT" ;;
            schedule:*:'17 0 * * *'|schedule:*:'47 1 * * *'|schedule:*:'17 3 * * *') python3 scripts/ci_intake_backup.py >> "$GITHUB_OUTPUT" ;;
            *) echo run=false >> "$GITHUB_OUTPUT" ;;
          esac
  intake:
    needs: clock
    if: needs.clock.outputs.run == 'true' && vars.READING_INTAKE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # cuarentena alta: una issue `fallo` por causa (scripts/refresh-reading-catalogue.py)
      pull-requests: write
      actions: write
      statuses: write
    # En el job y no en el workflow: un respaldo que decide no cargar nunca sustituye en la cola a una carga
    # encadenada pendiente (GitHub deja un solo pendiente por grupo).
    concurrency:
      group: reading-catalogue-intake
      cancel-in-progress: false
    # Dos ciclos de CI de la PR (~75 min cada uno si main avanza y se traslada la carga) más Pages.
    # 2026-11-05: la ejecución 41937351508 se cortó a los 135 min en el segundo ciclo con 22 libros listos.
    timeout-minutes: 240
    steps:
      # El publicador recorta todas sus esperas a este límite (limite_del_job): mejor soltar con informe que
      # dejar que GitHub cancele el job a mitad de una espera. Minutos = timeout-minutes - 10.
      - name: Límite del job para el publicador
        run: echo "PUBLICAR_HASTA=$(( $(date +%s) + 230 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Take the night turn
        # Libro de la noche (Fable R4-1): con el turno del grupo de concurrencia cogido, un reloj vuelve a decidir
        # con el libro (otra carga pudo empezar o publicar mientras esperaba) y la carga se anota en curso.
        id: libro
        if: ${{ !inputs.dry_run }}
        # Cada dato en su variable (sin expresión compuesta): el CI local también los resuelve.
        env:
          EVENT: ${{ github.event_name }}
          RESPALDO: ${{ inputs.respaldo }}
          PEDIDO: ${{ inputs.motivo }}
        shell: bash
        run: |
          MOTIVO="${PEDIDO:-manual}"
          if [ "$RESPALDO" = 'true' ]; then MOTIVO=respaldo; fi
          if [ "$EVENT" = 'schedule' ]; then MOTIVO=cron; fi
          python scripts/noche.py abrir --motivo "$MOTIVO" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: inputs.dry_run || steps.libro.outputs.cargar == 'true'
        with:
          node-version: '22'
      - name: Install pinned validation and search dependencies
        if: inputs.dry_run || steps.libro.outputs.cargar == 'true'
        run: |
          python -m pip install --requirement scripts/requirements.txt
          python -m pip install --requirement scripts/requirements-reading-audio.txt
          npm ci
      - name: Restore public editorial response cache
        if: inputs.dry_run || steps.libro.outputs.cargar == 'true'
        uses: actions/cache@v6
        with:
          path: .ci/reading-editorial-cache
          key: reading-editorial-v1-${{ github.run_id }}
          restore-keys: reading-editorial-v1-
      - name: Open the cover store (only when READING_COVERS_STORE=true)
        # Las portadas nuevas se suben al repositorio del almacén con una deploy key (GITHUB_TOKEN no escribe en otro repo).
        # Sin la variable no se hace nada y las portadas se siguen guardando en este repositorio.
        if: ${{ (inputs.dry_run || steps.libro.outputs.cargar == 'true') && vars.READING_COVERS_STORE == 'true' }}
        env:
          COVERS_KEY: ${{ secrets.COVERS_STORE_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$COVERS_KEY" > ~/.ssh/covers_store
          chmod 600 ~/.ssh/covers_store
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/covers_store -o IdentitiesOnly=yes'
          git clone --quiet --depth 1 git@github.com:davidpd89/web-escritor-portadas.git "$RUNNER_TEMP/portadas"
          echo "READING_COVERS_STORE_DIR=$RUNNER_TEMP/portadas" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/covers_store -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Discover, validate and publish through protected main
        id: carga
        if: inputs.dry_run || steps.libro.outputs.cargar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          # R4-9: la PR se abre con la App para que dispare sus comprobaciones; sin ellas se despacha como antes.
          REPARADOR_APP_ID: ${{ vars.REPARADOR_APP_ID }}
          REPARADOR_APP_INSTALLATION_ID: ${{ vars.REPARADOR_APP_INSTALLATION_ID }}
          REPARADOR_APP_PRIVATE_KEY: ${{ secrets.REPARADOR_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            python scripts/refresh-reading-catalogue.py
            # El ensayo no abre PR: comprueba aparte que la App da token (R4-9), sin mostrarlo.
            if [ -n "${REPARADOR_APP_ID:-}" ]; then
              if node scripts/app_token.mjs >/dev/null; then echo 'Token de la App: OK'; else echo '::warning::Sin token de la App: la PR se abriría con GITHUB_TOKEN'; fi
            fi
          else
            # Exit 75: main moved while the bot PR was in CI. The second attempt
            # finds that green PR still open and carries its source data (books,
            # pending candidates, prices) onto the new main without querying the
            # sources again; only pages and indices are rebuilt. Branch names
            # come from fresh_branch, so the retry never reuses attempt 1's.
            for attempt in 1 2; do
              rc=0
              python scripts/refresh-reading-catalogue.py --publish || rc=$?
              if [ "$rc" -eq 0 ]; then break; fi
              if [ "$rc" -ne 75 ] || [ "$attempt" -eq 2 ]; then exit "$rc"; fi
              git fetch --quiet origin main
              git switch --quiet --detach origin/main
              git reset --quiet --hard origin/main
              git clean --quiet -fd
            done
          fi
      - name: Close the night turn
        # Siempre que la carga se anotó: publicada, fallida o cancelada (también si el job se cancela).
        if: ${{ always() && !inputs.dry_run && steps.libro.outputs.cargar == 'true' }}
        # Un fallo antes de la carga (dependencias, caché) deja la carga en skipped: cuenta como el job (fallida),
        # para que el reintento no repita sin tope un fallo de instalación.
        env:
          CARGA: ${{ steps.carga.outcome }}
          JOB: ${{ job.status }}
        shell: bash
        run: |
          RESULTADO="$CARGA"
          if [ -z "$RESULTADO" ] || [ "$RESULTADO" = 'skipped' ]; then RESULTADO="$JOB"; fi
          python scripts/noche.py cerrar --resultado "$RESULTADO"
      - name: Report the failure as a `fallo` issue
        # R4-5 (D2): una carga degradada (publicó, pero descartó altas o precios) o fallida por código abre una issue
        # `fallo` por firma (o comenta en la abierta). Nadie arregla código de noche: se arregla de día.
        if: ${{ always() && !inputs.dry_run && steps.libro.outputs.cargar == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/resultado_carga.py issue
      - name: Chain the next night batch
        # GitHub drops most hourly crons under load (2026-11-04: one scheduled run all night), so a
        # batch that published new books dispatches the next one itself. Night only (00-06 Madrid, the
        # same night as the clocks and the retry: scripts/noche.py), so daytime merges from other work never
        # wait behind a load. A batch with nothing new or a failure stops the chain; the next cron picks up again.
        if: success() && !inputs.dry_run && steps.libro.outputs.cargar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Also while saved data branches remain (Fable F8): several checkpoints used to need several nights.
          read -r accepted saved query <<< "$(python -c "import json,pathlib;p=pathlib.Path('.ci/reading-intake/publisher-report.json');s=json.loads(p.read_text(encoding='utf-8')).get('stats',{}) if p.exists() else {};print(int(s.get('accepted',0)),int(s.get('checkpoints_restantes',0)),int(s.get('consulta_pendiente',0)))")"
          if python scripts/noche.py cadena --aceptados "$accepted" --guardadas "$saved" --consulta-pendiente "$query"; then
            gh workflow run reading-catalogue-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f motivo=cadena
            echo "Next night batch dispatched (accepted $accepted, saved $saved, query pending $query)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retry a failed night batch
        # 2026-11-14: two batches failed after accepting 200 books each and the chain stopped until the
        # next night. A failed batch leaves its data on automation/reading-datos-*, so a new run publishes
        # it without querying the sources again (and a fixed main may already be in place). Night only,
        # and at most three failed loads per night, counted in the night book (scripts/noche.py), so a
        # broken rule never loops.
        if: failure() && !inputs.dry_run && steps.libro.outputs.cargar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/noche.py reintento; then
            gh workflow run reading-catalogue-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f motivo=reintento
            echo "Failed batch: one retry dispatched (recovers the saved data branch)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read-only live provider pilot
        if: inputs.dry_run && inputs.live_provider_pilot
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
        run: python qa/reading-provider-pilot.py
      - name: Upload factual ingestion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reading-intake-review
          path: .ci/reading-intake/
          retention-days: 7
          if-no-files-found: warn
      - name: Explain result
        if: always()
        run: echo 'Sources are reviewed official editorial catalogues. Publication requires real CI, main rules and an exact-commit Pages deployment. No LLM or paid API is called. Missing data stays pending.' >> "$GITHUB_STEP_SUMMARY"
