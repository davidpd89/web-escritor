name: Reading catalogue intake

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and validate without changing the website'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: reading-catalogue-intake
  cancel-in-progress: false

jobs:
  intake:
    if: vars.READING_INTAKE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned validation and search dependencies
        run: |
          python -m pip install --requirement scripts/requirements.txt
          python -m pip install --requirement scripts/requirements-reading-audio.txt
          npm ci
      - name: Restore public editorial response cache
        uses: actions/cache@v5
        with:
          path: .ci/reading-editorial-cache
          key: reading-editorial-v1-${{ github.run_id }}
          restore-keys: reading-editorial-v1-
      - name: Test the ingestion contracts before network access
        run: python -m unittest discover -s tests -p 'test_reading*.py' -q
      - name: Discover, validate and publish through protected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = 'true' ]; then
            python scripts/refresh-reading-catalogue.py
          else
            python scripts/refresh-reading-catalogue.py --publish
          fi
      - name: Upload factual ingestion report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reading-intake-review
          path: .ci/reading-intake/
          retention-days: 7
          if-no-files-found: warn
      - name: Explain result
        if: always()
        run: echo 'Sources are reviewed official editorial catalogues. Publication requires real CI, main rules and an exact-commit Pages deployment. No LLM or paid API is called. Missing data stays pending.' >> "$GITHUB_STEP_SUMMARY"
