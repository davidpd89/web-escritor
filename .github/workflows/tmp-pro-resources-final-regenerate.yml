name: Temporary professional resources final regeneration

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-pro-resources-final-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install index tooling
        run: npm ci
      - name: Build Editoriales
        run: python3 scripts/build-editoriales.py --data data/editoriales.json --output . --today 2026-10-03
      - name: Build Convocatorias
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores --today 2026-10-03
      - name: Synchronize human site map from public publisher data
        run: |
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          root=Path('.')
          data=json.loads((root/'data/editoriales.json').read_text(encoding='utf-8'))
          pubs=sorted((p for p in data['publishers'] if p.get('publish') is True), key=lambda p:p['name'].casefold())
          path=root/'mapa-del-sitio/index.html'
          text=path.read_text(encoding='utf-8')
          items=['<li><a href="/editoriales/">Editoriales que aceptan manuscritos</a></li>']
          items += [f'<li><a href="/editoriales/{html.escape(p["slug"], quote=True)}/">{html.escape(p["name"])}</a></li>' for p in pubs]
          items += [
            '<li><a href="/convocatorias-escritores/">Convocatorias para escritores</a></li>',
            '<li><a href="/metodologia-editorial/">Metodología del directorio editorial</a></li>',
          ]
          replacement='<section class="directory-group" id="recursos-escritores"><p class="directory-group__label"><span>05</span><span>Publicar</span></p><h2>Directorios y recursos</h2><ul class="directory-list">'+''.join(items)+'</ul></section>'
          pattern=r'<section class="directory-group" id="recursos-escritores">[\s\S]*?</section>'
          updated,n=re.subn(pattern,replacement,text,count=1)
          if n!=1:
              raise SystemExit('No se pudo actualizar recursos-escritores en mapa-del-sitio')
          path.write_text(updated,encoding='utf-8')
          print(f'Mapa humano: {len(pubs)} editoriales')
          PY
      - name: Synchronize site shell
        run: python3 scripts/build-site-shell.py
      - name: Rebuild sitemap
        run: python3 scripts/build-sitemap.py --root . --output sitemap.xml
      - name: Rebuild Pagefind
        run: python3 scripts/build-pagefind-index.py
      - name: Remove temporary workflow and commit generated outputs
        run: |
          rm .github/workflows/tmp-pro-resources-final-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/tmp-pro-resources-final-regenerate.yml editoriales/ editoriales-sitemap.xml metodologia-editorial/index.html convocatorias-escritores/ sitemap.xml mapa-del-sitio/index.html pagefind/ index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 1
          fi
          git commit -m "chore(resources): regenerate final reviewed professional resources"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
