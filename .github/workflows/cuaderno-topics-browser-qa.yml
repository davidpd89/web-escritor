name: Cuaderno topics editorial QA

on:
  push:
    paths:
      - 'cuaderno/temas/**'
      - 'assets/v1-cuaderno-topics.css'
      - 'scripts/build-topic-collections.py'
      - 'data/topic-collections.json'
      - 'qa/cuaderno-topics-browser.mjs'
      - '.github/workflows/cuaderno-topics-browser-qa.yml'
  pull_request:
    paths:
      - 'cuaderno/temas/**'
      - 'assets/v1-cuaderno-topics.css'
      - 'scripts/build-topic-collections.py'
      - 'data/topic-collections.json'
      - 'qa/cuaderno-topics-browser.mjs'
      - '.github/workflows/cuaderno-topics-browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated topic collection outputs
        run: python scripts/build-topic-collections.py --data data/topic-collections.json --root . --check

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cuaderno-topics-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/cuaderno/temas/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cuaderno-topics-http.log
          exit 1

      - name: Run topic collection browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/cuaderno-topics
        run: node qa/cuaderno-topics-browser.mjs

      - name: Run topic collection WCAG2AA
        run: |
          npx pa11y-ci --config ./.pa11yci \
            http://127.0.0.1:4173/cuaderno/temas/ \
            http://127.0.0.1:4173/cuaderno/temas/fantasia-de-portales/

      - name: Run topic collection Lighthouse
        run: |
          cat > /tmp/cuaderno-topics-lhci.json <<'JSON'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://127.0.0.1:4173/cuaderno/temas/",
                  "http://127.0.0.1:4173/cuaderno/temas/fantasia-de-portales/"
                ],
                "numberOfRuns": 3,
                "settings": {"chromeFlags": "--no-sandbox"}
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.85, "aggregationMethod": "median"}],
                  "categories:accessibility": ["error", {"minScore": 0.97, "aggregationMethod": "median"}],
                  "categories:best-practices": ["warn", {"minScore": 0.95, "aggregationMethod": "median"}],
                  "categories:seo": "off",
                  "is-crawlable": ["error", {"minScore": 1}],
                  "document-title": ["error", {"minScore": 1}],
                  "meta-description": ["error", {"minScore": 1}],
                  "http-status-code": ["error", {"minScore": 1}],
                  "link-text": ["error", {"minScore": 1}],
                  "crawlable-anchors": ["error", {"minScore": 1}],
                  "hreflang": ["error", {"minScore": 1}],
                  "canonical": ["error", {"minScore": 1}],
                  "robots-txt": "off",
                  "largest-contentful-paint": ["warn", {"maxNumericValue": 3500, "aggregationMethod": "median"}],
                  "cumulative-layout-shift": ["error", {"maxNumericValue": 0.1, "aggregationMethod": "pessimistic"}],
                  "total-blocking-time": ["warn", {"maxNumericValue": 400, "aggregationMethod": "median"}]
                }
              }
            }
          }
          JSON
          npx lhci collect --config=/tmp/cuaderno-topics-lhci.json
          npx lhci assert --config=/tmp/cuaderno-topics-lhci.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuaderno-topics-editorial-evidence
          path: |
            qa-artifacts/cuaderno-topics/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
