name: Temporary regenerate expanded pro resources

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-expand-pro-resources.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate editorial directory
        run: python3 scripts/build-editoriales.py --data data/editoriales.json --output . --today 2026-10-03
      - name: Generate opportunity radar
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores --today 2026-10-03
      - name: Generate canonical sitemap
        run: python3 scripts/build-sitemap.py --root . --output sitemap.xml
      - name: Commit generated resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ editoriales-sitemap.xml metodologia-editorial/index.html convocatorias-escritores/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(resources): regenerate expanded directories"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
