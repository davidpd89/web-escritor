name: Temporary Pagefind registry-title regeneration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-pagefind-index.py'
      - 'tests/test-build-pagefind-index.py'
      - '.github/workflows/tmp-pagefind-registry-title.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-pagefind-registry-title
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Regression test Pagefind builder
        run: python tests/test-build-pagefind-index.py
      - name: Regenerate Pagefind with registry titles
        run: |
          python scripts/build-pagefind-index.py
          python scripts/build-pagefind-index.py --check
      - name: Remove this one-shot workflow
        run: rm .github/workflows/tmp-pagefind-registry-title.yml
      - name: Commit generated index to automation branch
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- pagefind .github/workflows/tmp-pagefind-registry-title.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/pagefind-registry-title-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pagefind .github/workflows/tmp-pagefind-registry-title.yml
          git commit -m "chore(search): regenerate Pagefind registry titles"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open regeneration PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "chore(search): regenerate Pagefind registry titles" \
            --body "Regeneración determinista de Pagefind tras alinear el título de búsqueda con content-registry.json. El workflow se elimina en este mismo PR."
