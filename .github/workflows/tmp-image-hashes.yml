name: Temporary image hash inventory

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-image-hashes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-256 inventory
        run: |
          sha256sum \
            assets/portada-las-manecillas-del-recuerdo-320.webp \
            assets/portada-las-manecillas-del-recuerdo-320.avif \
            assets/portada-las-manecillas-del-recuerdo-512.webp \
            assets/portada-las-manecillas-del-recuerdo-512.avif \
            assets/portada-las-manecillas-del-recuerdo-768.webp \
            assets/portada-las-manecillas-del-recuerdo-768.avif \
            assets/portada-las-manecillas-del-recuerdo-1024.webp \
            assets/portada-las-manecillas-del-recuerdo-1024.avif
