name: Temporary professional resources full regeneration final pass

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-pro-resources-full-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install index tooling
        run: npm ci
      - name: Build Editoriales
        run: python3 scripts/build-editoriales.py --data data/editoriales.json --output .
      - name: Build Convocatorias
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores
      - name: Synchronize site shell
        run: python3 scripts/build-site-shell.py
      - name: Rebuild sitemap
        run: python3 scripts/build-sitemap.py --root . --output sitemap.xml
      - name: Rebuild Pagefind
        run: python3 scripts/build-pagefind-index.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ editoriales-sitemap.xml metodologia-editorial/index.html convocatorias-escritores/ sitemap.xml mapa-del-sitio/index.html pagefind/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(resources): regenerate expanded professional resources"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
