name: Tools browser QA

on:
  pull_request:
    paths:
      - 'herramientas/manuscrito/**'
      - 'herramientas/dialogo/**'
      - 'herramientas/legibilidad/**'
      - 'herramientas/repeticiones/**'
      - 'herramientas/variedad-lexica/**'
      - 'assets/v1-shell.js'
      - 'assets/v1-tools.css'
      - 'assets/analizador-capitulos*'
      - 'assets/dialogo-espanol.js'
      - 'assets/legibilidad-*'
      - 'assets/repeticiones-*'
      - 'assets/variedad-lexica*'
      - 'qa/tools-browser.mjs'
      - 'qa/text-spacing.css'
      - '.github/workflows/tools-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tools-qa-server.log 2>&1 &
          echo $! > /tmp/tools-qa-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/herramientas/manuscrito/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tools-qa-server.log
          exit 1

      - name: Run browser QA
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts
        run: node qa/tools-browser.mjs

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
