name: Production edge cases QA

on:
  pull_request:
    paths:
      - 'qa/production-edge-cases.mjs'
      - '.github/workflows/production-edge-cases-qa.yml'
  push:
    branches: [main]
    paths:
      - 'qa/production-edge-cases.mjs'
      - '.github/workflows/production-edge-cases-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

jobs:
  production-edge-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE_BASE_URL: https://davidportodiaz.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install CI/QA dependencies
        run: npm ci

      - name: Syntax check
        run: node --check qa/production-edge-cases.mjs

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Audit canonical hosts, tiny viewports, text scaling and keyboard paths
        run: node qa/production-edge-cases.mjs
