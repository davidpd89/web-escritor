name: Runtime scoping QA

on:
  pull_request:
  push:
    branches:
      - pendiente-h-gpt-lineas-1-200
  workflow_dispatch:

jobs:
  runtime-scoping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check static runtime scoping contract
        run: python scripts/check-runtime-scoping.py

      - name: Test static runtime checker
        run: python tests/test-check-runtime-scoping.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run runtime scoping browser QA
        run: node qa/runtime-scoping-browser.mjs
