name: Runtime scoping QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-scoping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head for current-head cleanup
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Apply PR61 current-head cleanup once
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 61
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')

          # 1) Override Samuel legacy (must exist exactly once).
          styles, n = re.subn(
              r"body #buy-dialog\{.*?body #buy-dialog \.buy-option-cta,body #buy-dialog \.buy-dialog-note \.text-link\{[^{}]*\}",
              "",
              styles,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 Samuel override block in styles.css; found {n}')

          # 2) Base Samuel modal block (must exist exactly once).
          styles, n = re.subn(
              r"#buy-dialog\{.*?\.buy-dialog-note \.text-link\{[^{}]*\}",
              "",
              styles,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 Samuel base block in styles.css; found {n}')

          # 3) Affiliate note that belonged to the same modal.
          styles, n = re.subn(r"\n?\.buy-dialog-affiliate-note\s*\{[^{}]*\}\n?", "\n", styles, count=1)
          if n != 1:
              raise SystemExit(f'Expected 1 Samuel affiliate-note block in styles.css; found {n}')

          # 4) Known visible mojibake: intended em dash, same token used elsewhere.
          broken = 'Ã¢â‚¬â€'
          if styles.count(broken) != 1:
              raise SystemExit(f'Expected exactly 1 known mojibake token; found {styles.count(broken)}')
          styles = styles.replace(broken, r'\2014')

          for token in ('#buy-dialog', '.buy-dialog-', '.buy-option', broken):
              if token in styles:
                  raise SystemExit(f'Global styles cleanup incomplete: {token}')
          styles_path.write_text(styles, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          old = '''  btn.addEventListener("click", () => {
            scheduleTask(() => {
              const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
              window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
            }, "user-visible");
          });'''
          new = '''  btn.addEventListener("click", () => {
            const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
          });'''
          if script.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 deferred back-to-top handler; found {script.count(old)}')
          script = script.replace(old, new)
          script_path.write_text(script, encoding='utf-8')
          PY

          git diff --check
          if git diff --quiet -- styles.css script.js; then
            echo 'Current HEAD already contains cleanup.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css script.js
          git commit -m 'fix(runtime): remove global Samuel CSS and sync back-to-top'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Check static runtime scoping contract
        run: python scripts/check-runtime-scoping.py

      - name: Test static runtime checker
        run: python tests/test-check-runtime-scoping.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run runtime scoping browser QA
        run: node qa/runtime-scoping-browser.mjs
