name: Runtime scoping QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-scoping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check static runtime scoping contract
        run: python scripts/check-runtime-scoping.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run runtime scoping browser QA
        run: node qa/runtime-scoping-browser.mjs
