name: Reading Telegram clock

# GitHub drops most high-frequency cron runs (the publisher's quarter-hourly cron ran every 3-5 h),
# so the publisher cannot rely on its own schedule to hit 11:30 Madrid. This clock starts from any
# of several early, low-frequency crons, sleeps inside the job until SEND_AT and then dispatches
# the publisher, retrying if a cycle does not finish clean. The repository is public: the idle
# wait costs no Actions minutes. The publisher is idempotent (durable per-message claims), so an
# extra dispatch only skips what was already sent.

on:
  schedule:
    - cron: '41 5 * * *'
    - cron: '43 6 * * *'
    - cron: '41 7 * * *'
    - cron: '43 8 * * *'
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: reading-telegram-clock
  cancel-in-progress: false

jobs:
  clock:
    if: vars.READING_TELEGRAM_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-telegram.txt
      - name: Wait for the daily send time and dispatch the publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, subprocess, sys, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'scripts')
          from reading_telegram import SEND_AT

          JOB_END = time.time() + 340 * 60
          MADRID = ZoneInfo('Europe/Madrid')
          WORKFLOW = 'reading-telegram-publish.yml'
          now = datetime.now(MADRID)
          target = datetime.combine(now.date(), SEND_AT, MADRID)
          if now > target + timedelta(hours=3):
              print('Send window of today is over; the publisher catch-up crons handle the rest.')
              raise SystemExit(0)

          def runs_since(moment):
              out = subprocess.run(
                  ['gh', 'run', 'list', '--workflow', WORKFLOW, '--limit', '20',
                   '--json', 'databaseId,status,conclusion,createdAt,event'],
                  check=True, capture_output=True, text=True).stdout
              rows = json.loads(out)
              return [r for r in rows
                      if datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00')) >= moment]

          if now > target and any(r['conclusion'] == 'success' for r in runs_since(target)):
              print('Today has already been published cleanly.')
              raise SystemExit(0)

          wait = (target - now).total_seconds() + 20
          if wait > 0:
              print(f'Waiting {wait / 3600:.2f} h until {SEND_AT} Madrid.')
              time.sleep(wait)

          # Up to three cycles: the first sends the day; the next ones pick up rate-limited or
          # transiently unverified books. Stop as soon as one finishes clean.
          for attempt in range(3):
              if time.time() + 50 * 60 > JOB_END:
                  break
              started = datetime.now(MADRID)
              subprocess.run(['gh', 'workflow', 'run', WORKFLOW, '--ref', 'main'], check=True)
              print(f'Dispatched publisher (attempt {attempt + 1}).')
              deadline = min(time.time() + 50 * 60, JOB_END)
              run = None
              while time.time() < deadline:
                  time.sleep(30)
                  mine = [r for r in runs_since(started - timedelta(seconds=5))
                          if r['event'] == 'workflow_dispatch']
                  if mine and mine[-1]['status'] == 'completed':
                      run = mine[-1]
                      break
              conclusion = run and run['conclusion']
              print(f'Publisher finished: {conclusion}')
              if conclusion == 'success':
                  raise SystemExit(0)
              time.sleep(10 * 60)
          raise SystemExit('The publisher did not finish clean after three cycles: see its summary.')
