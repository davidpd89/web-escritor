name: Manecillas fragments navigation QA

on:
  pull_request:
    paths:
      - 'las-manecillas-del-recuerdo/fragmentos/index.html'
      - 'assets/v1-fragments.css'
      - 'assets/v1-fragments.js'
      - 'qa/manecillas-fragments-nav.mjs'
      - 'qa/manecillas-fragments-hash-regression.mjs'
      - '.github/workflows/manecillas-fragments-nav-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fragments-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_ORIGIN: http://127.0.0.1:4173
      QA_OUT: qa-artifacts
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fragments-server.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/las-manecillas-del-recuerdo/fragmentos/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/fragments-server.log
          exit 1
      - name: Run navigation and preservation QA
        run: BASE_SHA="$PR_BASE_SHA" node qa/manecillas-fragments-nav.mjs
      - name: Run malformed-hash regression
        run: node qa/manecillas-fragments-hash-regression.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manecillas-fragments-nav-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
