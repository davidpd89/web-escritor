name: Cross-engine smoke

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'script.js'
      - 'qa/cross-engine-smoke.mjs'
      - 'docs/compatibilidad-cross-browser.md'
      - '.github/workflows/cross-engine-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cross-engine-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (Chromium + Firefox + WebKit, with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run cross-engine smoke (Chromium + Firefox + WebKit)
        run: node qa/cross-engine-smoke.mjs
