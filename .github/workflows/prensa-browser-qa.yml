name: Prensa browser QA

on:
  pull_request:
    paths:
      - 'prensa.html'
      - 'assets/v1-families.css'
      - 'assets/v1-identity.css'
      - 'assets/v1-press.css'
      - 'qa/identity-public-browser.mjs'
      - 'qa/prensa-design-browser.mjs'
      - '.github/workflows/prensa-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/prensa-qa-server.log 2>&1 &
          echo $! > /tmp/prensa-qa-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/prensa.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/prensa-qa-server.log
          exit 1

      - name: Run inherited Identity authority
        env:
          IDENTITY_BASE_URL: http://127.0.0.1:4173
          IDENTITY_ARTIFACT_DIR: qa-artifacts/prensa-identity-authority
        run: node qa/identity-public-browser.mjs

      - name: Capture Prensa inherited baseline
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/prensa-design
        run: node qa/prensa-design-browser.mjs

      - name: Upload Prensa visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prensa-visual-evidence
          path: |
            qa-artifacts/prensa-design/
            qa-artifacts/prensa-identity-authority/
          if-no-files-found: warn
          retention-days: 14
