name: Accessibility baseline (Pa11y)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.css'
      - 'assets/**/*.js'
      - 'assets/**/*.mjs'
      - 'data/content-registry.json'
      - 'data/navigation.json'
      - 'scripts/build-*.py'
      - 'scripts/site_shell.py'
      - '.github/workflows/pa11y-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pa11y-shard:
    name: pa11y shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # El sitemap completo (~1140 URL) tardaba 33 min en un solo job; repartido en 4, cada shard audita ~285.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          fetch-depth: 0

      # Check obligatorio del ruleset: debe dar resultado en todas las PR, así que el trigger no
      # filtra por rutas. Este paso decide si la PR toca lo que Pa11y mide (las mismas rutas que el
      # push a main); si no, pasa sin recorrer el sitemap entero.
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"             | grep -qE '\.html$|^assets/.*\.(css|js|mjs)$|^data/(content-registry|navigation)\.json$|^scripts/build-[^/]*\.py$|^scripts/site_shell\.py$|^\.pa11yci$|^sitemap\.xml$|^\.github/workflows/pa11y-baseline\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Content lane (solo contenido generado => muestra de páginas)
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        # Decide la copia de la rama base (clasificador y política): un PR no puede cambiar las reglas que lo
        # evalúan. Si la base aún no tiene vía rápida, auditoría completa.
        run: |
          base="$RUNNER_TEMP/lane-base"; mkdir -p "$base"
          if git archive "${BASE_SHA:-origin/main}" scripts | tar -x -C "$base" && [ -f "$base/scripts/ci_content_lane.py" ]; then
            LANE_ROOT="$PWD" python3 "$base/scripts/ci_content_lane.py"
          else
            echo "lane=full | la base no tiene scripts/ci_content_lane.py"
            printf 'lane=full\nroutes=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: No HTML/CSS/JS changes -- skipping Pa11y
        if: steps.changes.outputs.relevant != 'true'
        run: echo "Esta PR no toca nada que Pa11y mida. Pasa sin ejecutarlo."

      # La muestra de la vía de contenido es pequeña: la audita entera el shard 0 y los demás pasan.
      - name: Decide this shard's work
        id: scope
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ "${{ steps.lane.outputs.lane }}" = "content" ] && [ "${{ matrix.shard }}" != "0" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Install Pa11y CI
        if: steps.scope.outputs.run == 'true'
        run: npm install --global pa11y-ci@5.0.0

      - name: Start local static server
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/web-escritor-http.log 2>&1 &
          echo $! > /tmp/web-escritor-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/web-escritor-http.log
          exit 1

      - name: Audit every URL in the sitemap
        if: steps.scope.outputs.run == 'true'
        id: pa11y
        shell: bash
        run: |
          set +e
          if [ "${{ steps.lane.outputs.lane }}" = "content" ]; then
            # Solo contenido generado: mismas reglas, sobre los índices y las páginas cambiadas más pesadas.
            ROUTES='${{ steps.lane.outputs.routes }}' python3 -c "import json, os; c = json.load(open('.pa11yci')); c['urls'] = ['http://127.0.0.1:4173' + r for r in os.environ['ROUTES'].split(',') if r]; json.dump(c, open('/tmp/pa11y-content.json', 'w'))"
            pa11y-ci --config /tmp/pa11y-content.json 2>&1 | tee pa11y-baseline.txt
          else
            # Una de cada 4 URL del sitemap, a 4 páginas a la vez (los vCPU del runner).
            SHARD=${{ matrix.shard }} python3 -c "import json, os, re; c = json.load(open('.pa11yci')); urls = re.findall(r'<loc>https://davidportodiaz\.com([^<]*)</loc>', open('sitemap.xml', encoding='utf-8').read()); c['concurrency'] = 4; c['urls'] = ['http://127.0.0.1:4173' + u for i, u in enumerate(urls) if i % 4 == int(os.environ['SHARD'])]; json.dump(c, open('/tmp/pa11y-full.json', 'w')); print(len(c['urls']), 'URL en este shard')"
            pa11y-ci --config /tmp/pa11y-full.json 2>&1 | tee pa11y-baseline.txt
          fi
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload baseline report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pa11y-baseline-${{ matrix.shard }}
          path: pa11y-baseline.txt
          retention-days: 14

      - name: Mark baseline result
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          status='${{ steps.pa11y.outputs.exit_code }}'
          if [ "$status" = "0" ]; then
            echo "Pa11y baseline is clean. This workflow can be promoted to a PR gate."
            exit 0
          fi
          echo "Pa11y found WCAG2AA errors (or a runner error). Review the artifact before promoting this to a PR gate."
          exit "$status"

  # Nombre del check obligatorio del ruleset: resume los shards.
  pa11y-baseline:
    needs: pa11y-shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        env:
          RESULT: ${{ needs.pa11y-shard.result }}
        run: |
          echo "pa11y-shard: $RESULT"
          [ "$RESULT" = "success" ]
