name: Reading intake offline unit tests

on:
  pull_request:
    paths:
      - 'scripts/reading_intake_*.py'
      - 'tests/test_reading_intake_*.py'
      - 'tests/fixtures/reading-google-books-2026.json'
      - 'data/reading-intake-sources.example.json'
      - 'data/editoriales.json'
      - '.github/workflows/reading-intake-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify syntax
        run: |
          python -m compileall -q scripts/reading_intake_*.py tests/test_reading_intake_*.py
      - name: Run offline tests — no API keys or network access
        run: python -m unittest discover -s tests -p 'test_reading_intake_*.py' -v
