name: Reading intake offline unit tests

on:
  pull_request:
    paths:
      - 'scripts/reading_intake_*.py'
      - 'scripts/reading_editorial_metadata.py'
      - 'scripts/reading_editorial_sources.py'
      - 'scripts/reading_planeta_source.py'
      - 'tests/test_reading_planeta_source.py'
      - 'tests/fixtures/planeta-ficha-cosamala.html'
      - 'scripts/reading_publisher_links.py'
      - 'scripts/publish-reading-refresh.py'
      - 'scripts/publish-radar-refresh.py'
      - 'scripts/refresh-reading-catalogue.py'
      - 'data/reading-intake-config.json'
      - 'tests/test_reading_intake_*.py'
      - 'tests/test_reading_editorial_metadata.py'
      - 'tests/test_reading_intake_multibook_contract.py'
      - 'scripts/build-reading-catalogue.py'
      - 'scripts/templates/reading-catalogue.html.tmpl'
      - 'scripts/requirements.txt'
      - 'tests/fixtures/reading-google-books-2026.json'
      - 'data/reading-intake-sources.example.json'
      - 'data/editoriales.json'
      - '.github/workflows/reading-intake-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install shared Python dependencies for real PR660 builder
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Verify syntax
        run: |
          python -m compileall -q scripts/reading_intake_*.py scripts/reading_editorial_metadata.py tests/test_reading_intake_*.py tests/test_reading_editorial_metadata.py
      - name: Run offline tests — no API keys or network access
        run: |
          python -m unittest discover -s tests -p 'test_reading*.py' -v
          python tests/test-radar-publication.py
