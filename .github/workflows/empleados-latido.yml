name: Latido de empleados

# Pasa lista a diario: qué workflow programado no ha fichado o lleva varias ejecuciones en rojo.
# Mantiene un único issue con la etiqueta «latido» y lo cierra cuando todos vuelven a verde.
# Sin pull_request: el job escribe issues y R5-8 prohíbe escrituras en workflows de PR. En las PR, el cuadre
# registro/workflows lo comprueba tests/test_empleados_registro.py dentro de la puerta obligatoria.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/expertos.json
            scripts/empleados_latido.py
            tests/test_empleados_registro.py
            .github/workflows
      - name: Registro y workflows cuadran
        run: |
          python scripts/empleados_latido.py registro
          python -m unittest tests.test_empleados_registro
      - name: Pasar lista
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          # El issue solo lo toca la ejecución de main (empleados_latido.py ignora --issue desde otra rama).
          python scripts/empleados_latido.py latido --salida latido.md --issue
          cat latido.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: latido-empleados
          path: latido.md
          if-no-files-found: ignore
          retention-days: 30
