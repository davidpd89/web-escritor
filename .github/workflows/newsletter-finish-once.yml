name: Newsletter finish once

on:
  push:
    branches:
      - fix/newsletter-consent-shell-wiring-2026-08-31
    paths:
      - 'scripts/_finish_newsletter_292.py'
      - '.github/workflows/newsletter-finish-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/newsletter-consent-shell-wiring-2026-08-31
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reconciliation
        run: python3 scripts/_finish_newsletter_292.py

      - name: Remove one-shot helpers
        run: rm scripts/_finish_newsletter_292.py .github/workflows/newsletter-finish-once.yml

      - name: Commit generated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete newsletter consent and shell wiring"
          git push origin HEAD:fix/newsletter-consent-shell-wiring-2026-08-31
