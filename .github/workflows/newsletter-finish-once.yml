name: Newsletter finish once

on:
  push:
    branches:
      - fix/newsletter-consent-shell-wiring-2026-08-31
    paths:
      - 'scripts/_finish_newsletter_292.py'
      - '.github/workflows/newsletter-finish-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/newsletter-consent-shell-wiring-2026-08-31
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reconciliation and verify generated result
        shell: bash
        run: |
          set +e
          python3 scripts/_finish_newsletter_292.py
          initial_rc=$?
          set -e
          echo "Initial reconciliation exit: ${initial_rc}"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tests/test-newsletter-client-contract.mjs')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r"assert\.match\(builderSource, /id=.*?'shell builder must generate Explore consent'\);",
              re.S,
          )
          replacement = "assert.ok(builderSource.includes('nl-gdpr-explore'),\n  'shell builder must generate Explore consent');"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one brittle builder assertion, found {count}')
          p.write_text(text, encoding='utf-8')
          PY
          test -f assets/newsletter-general.js
          grep -q 'DPNewsletterGeneral' assets/newsletter-general.js
          grep -q 'nl-gdpr-explore' scripts/build-site-shell.py
          grep -q 'nl-gdpr-fragmento' fragmento/index.html
          grep -q 'nl-gdpr-manecillas' las-manecillas-del-recuerdo/index.html
          grep -q 'nl-gdpr-cuaderno' cuaderno/index.html
          grep -q 'nl-gdpr-home' index.html
          python3 scripts/build-site-shell.py --check
          node tests/test-newsletter-client-contract.mjs

      - name: Remove one-shot helpers
        run: rm scripts/_finish_newsletter_292.py .github/workflows/newsletter-finish-once.yml

      - name: Commit generated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete newsletter consent and shell wiring"
          git push origin HEAD:fix/newsletter-consent-shell-wiring-2026-08-31
