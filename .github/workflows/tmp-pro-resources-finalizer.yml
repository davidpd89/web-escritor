name: Temporary professional resources finalizer

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - 'scripts/build-editoriales.py'
      - 'scripts/build-radar-opportunities.py'
      - 'scripts/check-asset-versions.py'
      - '.github/workflows/tmp-pro-resources-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate editoriales
        run: python3 scripts/build-editoriales.py --data data/editoriales.json --output .
      - name: Regenerate convocatorias
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores
      - name: Refresh site shell
        run: python3 scripts/build-site-shell.py
      - name: Refresh sitemap
        run: python3 scripts/build-sitemap.py --root . --output sitemap.xml
      - name: Refresh Pagefind
        run: python3 scripts/build-pagefind-index.py
      - name: Record new asset hashes
        run: python3 scripts/check-asset-versions.py --update-hashes
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ metodologia-editorial/index.html editoriales-sitemap.xml convocatorias-escritores/ sitemap.xml pagefind/ scripts/asset-version-hashes.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(resources): regenerate final outputs and asset hashes"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
