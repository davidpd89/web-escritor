name: Temporary professional resources executor

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-pro-resources-executor.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm ci
      - name: Regenerate professional resources and derived indexes
        run: |
          python3 scripts/build-editoriales.py --data data/editoriales.json --output .
          python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores
          python3 scripts/build-site-shell.py
          python3 scripts/build-sitemap.py --root . --output sitemap.xml
          python3 scripts/build-pagefind-index.py
          python3 scripts/check-asset-versions.py --update-hashes
      - name: Enforce regeneration scope
        shell: bash
        run: |
          bad=0
          while IFS= read -r path; do
            case "$path" in
              editoriales/*|convocatorias-escritores/*|metodologia-editorial/index.html|mapa-del-sitio/index.html|sitemap.xml|pagefind/*|scripts/asset-version-hashes.json) ;;
              *) echo "Unexpected generated change outside PR scope: $path"; bad=1 ;;
            esac
          done < <(git diff --name-only)
          exit "$bad"
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ convocatorias-escritores/ metodologia-editorial/index.html mapa-del-sitio/index.html sitemap.xml pagefind/ scripts/asset-version-hashes.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(resources): regenerate final 2026-10-04 outputs"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
