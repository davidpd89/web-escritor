name: Temporary professional resources regeneration

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - 'data/editoriales.json'
      - 'data/radar-opportunities.json'
      - 'data/radar-sources.json'
      - '.github/workflows/tmp-pro-resources-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate editorials
        run: python3 scripts/build-editoriales.py --data data/editoriales.json --output .
      - name: Generate opportunities
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores
      - name: Generate sitemap
        run: python3 scripts/build-sitemap.py --root . --output sitemap.xml
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ editoriales-sitemap.xml metodologia-editorial/index.html convocatorias-escritores/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(resources): regenerate public professional resources"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
