name: Reading Telegram preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/reading_telegram.py'
      - 'scripts/reading_telegram_worker.py'
      - 'scripts/reading_telegram_state.py'
      - 'scripts/install-reading-telegram-task.ps1'
      - 'scripts/requirements-telegram.txt'
      - 'tests/test_reading_telegram.py'
      - 'tests/test_reading_telegram_worker.py'
      - 'tests/test_reading_telegram_state.py'
      - '.github/workflows/reading-telegram-publish.yml'
      - 'data/reading-telegram.example.json'
      - '.github/workflows/reading-telegram-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-telegram.txt
      - run: python -m unittest discover -s tests -p 'test_reading_telegram*.py' -v
      - name: Preview existing catalogue without secrets or Telegram calls
        run: python scripts/reading_telegram.py --channels data/reading-telegram.example.json
      - name: Preview a labelled historical edition without publishing
        run: python scripts/reading_telegram.py --channels data/reading-telegram.example.json --test-asin 8498382378
