name: Navigation menus multi-device QA

# Cabecera, menú ☰ (Explorar), barras de sección y barra de la portada en 9
# anchos de móvil, tablet y escritorio: que todo quepa, se pueda pulsar, se
# cierre bien y ofrezca los mismos destinos en todas las páginas.
on:
  pull_request:
    paths:
      - 'data/navigation.json'
      - 'data/content-registry.json'
      - 'scripts/build-site-shell.py'
      - 'scripts/build-section-context-nav.py'
      - 'assets/v1-shell.js'
      - 'assets/v1-shell-base.css'
      - 'assets/v1-shell-lrb-v2.css'
      - 'assets/v1-shell.css'
      - 'assets/v1-editorial-interior-v4.js'
      - 'assets/v1-editorial-interior-v4.css'
      - 'qa/navigation-menus-multidevice.mjs'
      - '.github/workflows/navigation-menus-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run navigation menus multi-device QA
        run: node qa/navigation-menus-multidevice.mjs
