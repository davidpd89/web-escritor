name: PWA offline QA

on:
  pull_request:
    paths:
      - "service-worker.js"
      - "offline.html"
      - "manifest.json"
      - "assets/icon-*.png"
      - "assets/fonts/is-normal-400-latin.woff2"
      - "assets/fonts/mr-normal-400-700-latin.woff2"
      - "qa/pwa-offline.mjs"
      - "qa/pwa-cache-freshness-contract.mjs"
      - "qa/pwa-shortcuts-contract.mjs"
      - ".github/workflows/pwa-offline-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pwa-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify cache freshness / media-range policy
        run: node qa/pwa-cache-freshness-contract.mjs

      - name: Verify canonical manifest shortcuts
        run: node qa/pwa-shortcuts-contract.mjs

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run PWA/offline contract QA
        run: node qa/pwa-offline.mjs

      - name: Upload PWA/offline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pwa-offline-evidence
          path: artifacts/pwa-offline/
          if-no-files-found: warn
