name: Tool engine tests

# Por que existe: los test-*.mjs de tests/ (motores de herramientas y
# contratos del asistente) y los test-*.py de contratos compartidos deben
# ejecutarse en cada PR que pueda alterar su comportamiento. El bucle por
# fichero es deliberado: este repositorio no tiene un runner central y cada
# test independiente imprime OK o lanza una assertion.

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'asistente/**'
      - 'herramientas/**'
      - 'publicar-web/**'
      - 'cloudflare-worker-assistant.js'
      - 'data/assistant-source-registry.json'
      - 'data/implementation-truth-ledger.json'
      - 'data/tools-hub.json'
      - 'docs/assistant-deploy.md'
      - 'docs/IMPLEMENTATION-TRUTH-LEDGER-2026-08-27.md'
      - 'migrations/assistant-quota.sql'
      - 'scripts/audit-author-web.py'
      - 'scripts/check-assistant-contract.py'
      - 'scripts/brevo/snapshot-brevo.py'
      - 'scripts/requirements.txt'
      - 'wrangler.assistant.example.jsonc'
      - 'lighthouserc.json'
      - '.github/workflows/tool-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run every tests/*.mjs engine test
        run: |
          set -e
          fail=0
          for f in tests/*.mjs; do
            echo "::group::$f"
            if ! node "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install shared Python dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Run every tests/test-*.py
        run: |
          set -e
          fail=0
          for f in tests/test-*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            if ! python "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
