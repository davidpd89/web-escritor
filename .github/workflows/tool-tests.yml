name: Tool engine tests

# Por que existe: los ~22 test-*.mjs de tests/ (motor de legibilidad,
# silabas, ZIP del kit de prensa, ICS/RFC 5545, deteccion de personajes
# parecidos, distribucion de POV, etc.) nunca corrian en ningun workflow.
# Se ejecutaban a mano en cada sesion de auditoria, pero un PR normal podia
# fusionar una regresion real en cualquiera de esos motores sin que ningun
# check en rojo lo avisara. Ya paso una vez de hecho: silabajs-lite-2.1.0.js
# desplegado era un stub de conteo silabico que fallaba los propios casos de
# prueba del documento fuente (32), y ningun CI lo habria detectado porque
# nada ejecutaba tests/test-silabas-espanol.mjs.
#
# El bucle de bash con `|| exit 1` por fichero es deliberado: node no tiene
# aqui un test runner central (no hay package.json), cada fichero es un
# script independiente que imprime OK o lanza una assertion. Correr todos y
# fallar el job si CUALQUIERA falla es el equivalente correcto a "npm test"
# para esta forma de organizar los tests.

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/tool-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every tests/*.mjs engine test
        run: |
          set -e
          fail=0
          for f in tests/*.mjs; do
            echo "::group::$f"
            if ! node "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every tests/test-*.py
        run: |
          set -e
          fail=0
          for f in tests/test-*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            if ! python "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
