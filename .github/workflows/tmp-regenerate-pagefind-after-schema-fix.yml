name: Temporary Pagefind regeneration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-regenerate-pagefind-after-schema-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate Pagefind with official builder
        run: python scripts/build-pagefind-index.py

      - name: Verify only expected generated files changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^pagefind/' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
          python scripts/build-pagefind-index.py --check

      - name: Commit generated Pagefind and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind/
          git rm .github/workflows/tmp-regenerate-pagefind-after-schema-fix.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(search): regenerate Pagefind after schema fix"
          git push origin HEAD:main
