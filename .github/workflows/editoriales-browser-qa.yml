name: Editoriales browser QA

on:
  pull_request:
    paths:
      - 'editoriales/**'
      - 'assets/editoriales.css'
      - 'assets/v1-tools.css'
      - 'scripts/build-editoriales.py'
      - 'qa/editoriales-index-design-browser.mjs'
      - '.github/workflows/editoriales-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/editoriales-qa-server.log 2>&1 &
          echo $! > /tmp/editoriales-qa-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/editoriales/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/editoriales-qa-server.log
          exit 1

      - name: Run Editoriales visual-system contract
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/editoriales-index
        run: node qa/editoriales-index-design-browser.mjs

      - name: Upload Editoriales visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editoriales-visual-evidence
          path: qa-artifacts/editoriales-index/
          if-no-files-found: warn
          retention-days: 14
