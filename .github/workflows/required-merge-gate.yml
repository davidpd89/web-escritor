name: Required merge gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-merge-gate:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This workflow is a required ruleset context. Universal repository
      # contracts must therefore execute here too; otherwise a red optional
      # workflow (for example Tool engine tests) can coexist with a green
      # Required merge gate and GitHub itself would not enforce the red test.
      - name: Install shared Python dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Run universal Python contracts
        shell: bash
        run: |
          set -e
          fail=0
          for f in tests/test-*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            if ! python "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Verify deterministic performance budgets
        run: python scripts/check-performance-budgets.py --check --json .ci/performance-budget.json

      - name: Run universal Node engine contracts
        shell: bash
        run: |
          set -e
          fail=0
          for f in tests/*.mjs; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            if ! node "$f"; then
              echo "FALLA: $f"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Validate release smoke syntax
        run: node --check tests/test-staging-smoke.mjs

      - name: Verify exact-release identity contract
        run: python tests/test-release-identity.py

      - name: Generate consolidated static release evidence
        run: python scripts/release-readiness.py --output .ci/release-readiness.md

      - name: Verify generated site shell is current
        run: python scripts/build-site-shell.py --check

      - name: Verify sitemap is current
        run: python scripts/build-sitemap.py --check

      - name: Verify public editorial facts projection is current
        run: python scripts/build-public-editorial-facts.py --check

      - name: Verify assistant source-index parity
        run: node scripts/test-assistant-index-parity.mjs

      - name: Run public-artifact boundary regression tests
        run: python tests/test-public-artifact-contract.py

      - name: Run staging/publication boundary regression tests
        run: python tests/test-staging-publication-gate.py

      - name: Verify generated staging publication policy
        run: python scripts/build-public-dist.py --check-assetsignore

      - name: Build final public artifact
        run: python scripts/build-public-dist.py --out .preview-dist

      - name: Re-check final public artifact contents
        run: python scripts/build-public-dist.py --check-contents --out .preview-dist

      - name: Prove marker can be stamped into built artifact
        shell: bash
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/stamp-release-identity.py --out .preview-dist --sha "$SHA"
          python scripts/stamp-release-identity.py --check --out .preview-dist --sha "$SHA"

      - name: Upload release-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-merge-gate-evidence
          path: |
            .ci/release-readiness.md
            .ci/performance-budget.json
          if-no-files-found: warn
          retention-days: 14
