name: Repair Prensa shell

on:
  push:
    branches:
      - design/prensa-visual-unification-2026-08-30

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/prensa-visual-unification-2026-08-30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical site shell
        run: python scripts/build-site-shell.py
      - name: Require Prensa-only generated diff
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed after generator: %s\n' "${changed[*]:-<none>}"
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "prensa.html" ]]; then
            echo "Expected the canonical generator to change only prensa.html" >&2
            exit 1
          fi
          git diff --check
      - name: Commit canonical generated shell
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prensa.html
          git commit -m "fix(press): regenerate canonical site shell"
          git push origin HEAD:design/prensa-visual-unification-2026-08-30
