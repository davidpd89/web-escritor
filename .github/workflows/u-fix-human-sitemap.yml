name: U synchronize human site map

on:
  pull_request:
    paths:
      - '.github/workflows/u-fix-human-sitemap.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Add reading-card route to human site map
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mapa-del-sitio/index.html')
          text = path.read_text(encoding='utf-8')
          route = '/herramientas/tarjeta-estoy-leyendo/'
          if route not in text:
              needle = '<li><a href="/herramientas/kit-prensa-escritores/">Generador de kit de prensa</a></li>'
              replacement = needle + '<li><a href="/herramientas/tarjeta-estoy-leyendo/">Tarjeta «Estoy leyendo»</a></li>'
              if needle not in text:
                  raise SystemExit('FAIL: insertion anchor not found in human site map')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python scripts/check-global-discoverability.py

      - name: Commit map fix and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/u-fix-human-sitemap.yml
          git add mapa-del-sitio/index.html .github/workflows/u-fix-human-sitemap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'U.1: include reading card in human site map'
          git push origin "HEAD:${HEAD_BRANCH}"
