name: Temporary browser favicon normalization

# Relaunch marker: rebase normalization on current main (2026-10-06)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-head-icons.py'
      - 'tests/test-head-icon-normalizer.py'
      - 'tests/test-manifest-pwa-contract.py'
      - '.github/workflows/tmp-normalize-browser-favicon.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-browser-favicon-normalization
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fast-forward to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Normalize browser favicon declarations
        run: |
          python scripts/check-head-icons.py --write
          python scripts/check-head-icons.py --check
          python tests/test-head-icon-normalizer.py

      - name: Rebuild Pagefind source hashes/index
        run: |
          npm ci
          python scripts/build-pagefind-index.py
          python scripts/build-pagefind-index.py --check

      - name: Validate icon/PWA and generated resource contracts
        run: |
          python tests/test-manifest-pwa-contract.py
          python tests/test-editoriales-builder-parity-v1.py
          python tests/test-radar-builder-parity-v1.py
          git diff --check

      - name: Enforce normalization scope
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              *.html|scripts/*.py|pagefind/*)
                ;;
              *)
                echo "Unexpected normalization change: $path"
                bad=1
                ;;
            esac
          done < <(git diff --name-only)
          exit "$bad"

      - name: Publish deterministic normalization as protected pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-normalize-browser-favicon.yml
          if git diff --quiet; then
            echo "Nothing to normalize."
            exit 0
          fi
          branch="automation/browser-favicon-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "perf: use lightweight browser favicon sitewide"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "perf: use lightweight browser favicon sitewide" \
            --body "Normalización determinista del favicon de navegador a `/favicon.ico`, manteniendo el Apple touch icon amarillo aprobado. Regenera Pagefind, valida builders y retira este workflow temporal."
