name: Reading catalogue UX and moderated reviews (offline)

on:
  pull_request:
    paths:
      - 'scripts/build-reading-catalogue.py'
      - 'scripts/export-reading-approved-reviews.py'
      - 'scripts/reading_ratings_refresh.py'
      - 'assets/reading-catalogue.js'
      - 'tests/test_reading_affiliate_card_ux.py'
      - 'tests/test_reading_review_moderation_export.py'
      - 'tests/test_reading_ratings_refresh.py'
      - '.github/workflows/reading-general-catalogue-ux-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing builder dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Compile changes
        run: python -m py_compile scripts/build-reading-catalogue.py scripts/export-reading-approved-reviews.py scripts/reading_ratings_refresh.py tests/test_reading_affiliate_card_ux.py tests/test_reading_review_moderation_export.py tests/test_reading_ratings_refresh.py
      - name: Test all existing catalogue data and affiliate links
        run: python -m unittest discover -s tests -p 'test_reading_affiliate_card_ux.py' -v
      - name: Test private review moderation export and retraction
        run: python -m unittest discover -s tests -p 'test_reading_review_moderation_export.py' -v
      - name: Test Google Books provider offline, no API key
        run: python -m unittest discover -s tests -p 'test_reading_ratings_refresh.py' -v
      - name: JavaScript syntax check
        run: node --check assets/reading-catalogue.js
