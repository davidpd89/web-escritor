name: Editorial facts check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'autor.html'
      - 'libros/**'
      - 'las-manecillas-del-recuerdo/**'
      - 'prensa.html'
      - 'premios.html'
      - 'eventos.html'
      - 'ferias.html'
      - 'ai/**'
      - 'llms*.txt'
      - 'humans.txt'
      - 'press-kit/**'
      - 'manifest.json'
      - 'editorial-facts.json'
      - 'scripts/check-editorial-facts.py'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'autor.html'
      - 'libros/**'
      - 'las-manecillas-del-recuerdo/**'
      - 'prensa.html'
      - 'premios.html'
      - 'eventos.html'
      - 'ferias.html'
      - 'ai/**'
      - 'llms*.txt'
      - 'humans.txt'
      - 'press-kit/**'
      - 'manifest.json'
      - 'editorial-facts.json'
      - 'scripts/check-editorial-facts.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Estado que se quiere validar'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prelaunch
          - launch

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  editorial-facts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check launch-critical editorial facts
        env:
          MANUAL_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/check-editorial-facts.py --mode "$MANUAL_MODE"
      - name: Check Las manecillas del recuerdo prelaunch markers
        run: python scripts/apply-manecillas-launch-state.py --check
