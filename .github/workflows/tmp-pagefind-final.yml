name: Temporary professional resources final regeneration

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - '.github/workflows/tmp-pagefind-final.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned Pagefind
        run: npm install --no-save pagefind@1.5.2
      - name: Regenerate professional resources
        run: |
          python3 scripts/build-editoriales.py --data data/editoriales.json --output .
          python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out convocatorias-escritores
          python3 scripts/build-site-shell.py
          python3 scripts/build-sitemap.py --root . --output sitemap.xml
          python3 scripts/build-pagefind-index.py
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editoriales/ editoriales-sitemap.xml metodologia-editorial/index.html convocatorias-escritores/ sitemap.xml mapa-del-sitio/ pagefind/ '*.html' */index.html */*/index.html */*/*/index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(resources): regenerate final verified resource outputs"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
