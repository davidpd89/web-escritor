name: Temporary Pagefind final regeneration

on:
  push:
    branches:
      - feat/pro-resources-editoriales-convocatorias-20261002
    paths:
      - 'qa/pro-resources-browser.mjs'
      - '.github/workflows/tmp-pagefind-final.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-resources-editoriales-convocatorias-20261002
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned Pagefind
        run: npm install --no-save pagefind@1.5.2
      - name: Regenerate Pagefind
        run: python3 scripts/build-pagefind-index.py
      - name: Commit Pagefind outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(search): regenerate Pagefind for expanded resources"
          git push origin HEAD:feat/pro-resources-editoriales-convocatorias-20261002
