name: Samuel ecosystem browser QA

on:
  pull_request:
    paths:
      - 'libros/samuel-entre-mundos/**'
      - 'fragmento/**'
      - 'universo/noveris/**'
      - 'clubes-de-lectura/samuel-entre-mundos/**'
      - 'assets/v1-samuel.css'
      - 'assets/fragmento.css'
      - 'assets/samuel-quiz.js'
      - 'assets/samuel-buy-modal.js'
      - 'assets/samuel-buy-modal.css'
      - 'assets/noveris.css'
      - 'assets/clubes-samuel.css'
      - 'tests/test-samuel-ecosystem-parity.py'
      - 'qa/samuel-book-fragment-browser.mjs'
      - 'qa/samuel-ecosystem-browser.mjs'
      - 'qa/samuel-design-browser.mjs'
      - 'qa/samuel-design-cross-engine.mjs'
      - 'qa/samuel-ecosystem-text-resilience.css'
      - 'qa/samuel-ecosystem-lighthouserc.json'
      - '.github/workflows/samuel-ecosystem-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_ORIGIN: http://127.0.0.1:4173
      QA_OUT: qa-artifacts/samuel-ecosystem
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static authority and parity contract
        run: python3 tests/test-samuel-ecosystem-parity.py

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Run Samuel ecosystem browser QA
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/samuel-ecosystem-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/libros/samuel-entre-mundos/ >/dev/null \
              && curl -fsS http://127.0.0.1:4173/fragmento/ >/dev/null \
              && curl -fsS http://127.0.0.1:4173/universo/noveris/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node qa/samuel-book-fragment-browser.mjs
          node qa/samuel-ecosystem-browser.mjs

      - name: Run focused Lighthouse gate
        run: |
          set -e
          npx lhci collect --config=./qa/samuel-ecosystem-lighthouserc.json
          npx lhci assert --config=./qa/samuel-ecosystem-lighthouserc.json
          mkdir -p qa-artifacts/samuel-ecosystem/lighthouse
          cp -R .lighthouseci/. qa-artifacts/samuel-ecosystem/lighthouse/

      - name: Upload Samuel ecosystem QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samuel-ecosystem-qa
          path: qa-artifacts/samuel-ecosystem/
          if-no-files-found: warn
          retention-days: 14
