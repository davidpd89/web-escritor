name: Ferias browser QA

on:
  pull_request:
    paths:
      - 'ferias.html'
      - 'assets/v1-families.css'
      - 'assets/v1-ferias.css'
      - 'qa/ferias-design-browser.mjs'
      - '.github/workflows/ferias-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI/QA dependencies (Node)
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ferias-qa-server.log 2>&1 &
          echo $! > /tmp/ferias-qa-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ferias.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ferias-qa-server.log
          exit 1
      - name: Validate Ferias visual-system contract
        run: node qa/ferias-design-browser.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/ferias-design
      - name: Upload Ferias visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferias-visual-evidence
          path: qa-artifacts/ferias-design/
          if-no-files-found: warn
          retention-days: 14
