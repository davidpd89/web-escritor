name: TEMP regenerate Pagefind

on:
  push:
    branches:
      - qa/postdeploy-edge-cases-20261005
    paths:
      - '.github/workflows/tmp-regenerate-pagefind.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: qa/postdeploy-edge-cases-20261005
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Pagefind with official builder
        run: python scripts/build-pagefind-index.py

      - name: Commit generated Pagefind if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pagefind; then
            echo "Pagefind already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind
          git commit -m "chore: regenerate Pagefind after home update"
          git push origin HEAD:qa/postdeploy-edge-cases-20261005
