name: Calidad de HTML y CSS

# Dos empleados gratuitos: HTML-validate (HTML mal formado en portada y en una muestra fija de fichas) y
# Stylelint (errores reales en el CSS propio: propiedades desconocidas, duplicados, colores inválidos).
# Informativo: no bloquea. Lo encontrado va a un issue vivo con la etiqueta «calidad-html» (scripts/issue_vivo.py),
# que se cierra solo cuando las dos herramientas vuelven a estar limpias.
# La muestra es 1 de cada 150 fichas por orden alfabético: crece con el catálogo sin descargar el sitio entero.
# Sin pull_request: escribe issues y R5-8 prohíbe escrituras en workflows de PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '53 4 * * 3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  html-css:
    name: HTML-validate y Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /styles.css
            /assets/**/*.css
            /qa/htmlvalidate.json
            /qa/stylelint.json
            /scripts/issue_vivo.py
      - name: Elegir la muestra de fichas
        id: muestra
        continue-on-error: true
        run: |
          git ls-tree -r --name-only HEAD -- recomendaciones | grep '\.html$' | sort | awk 'NR % 150 == 1' > muestra.txt
          git sparse-checkout add --stdin < muestra.txt
          ls ./*.html >> muestra.txt
          echo "Páginas en la muestra: $(wc -l < muestra.txt)"
      - name: HTML-validate
        id: html
        continue-on-error: true
        run: |
          set -o pipefail
          xargs -d '\n' npx --yes html-validate@9 --config qa/htmlvalidate.json < muestra.txt > html-validate.txt 2>&1
      - name: Stylelint
        id: css
        continue-on-error: true
        run: |
          npx --yes stylelint@16 --config qa/stylelint.json --formatter compact "styles.css" "assets/**/*.css" > stylelint.txt 2>&1
      - name: Resumen
        if: always()
        env:
          MUESTRA: ${{ steps.muestra.outcome }}
          HTML: ${{ steps.html.outcome }}
          CSS: ${{ steps.css.outcome }}
        run: |
          {
            echo "Muestra: $MUESTRA ($(wc -l < muestra.txt 2>/dev/null || echo 0) páginas)."
            echo "## HTML-validate: $HTML"; echo '```'; tail -n 120 html-validate.txt 2>/dev/null; echo '```'
            echo "## Stylelint: $CSS"; echo '```'; tail -n 120 stylelint.txt 2>/dev/null; echo '```'
          } > calidad.md
          cat calidad.md >> "$GITHUB_STEP_SUMMARY"
      - name: Aviso en el issue «calidad-html»
        if: always() && steps.html.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          HTML: ${{ steps.html.outcome }}
          CSS: ${{ steps.css.outcome }}
        run: |
          aviso=0; { [ "$HTML" = failure ] || [ "$CSS" = failure ]; } && aviso=1
          python scripts/issue_vivo.py --etiqueta calidad-html --titulo "Calidad de HTML y CSS: HTML $HTML, CSS $CSS" \
            --cuerpo calidad.md --aviso "$aviso" --cierre "HTML-validate y Stylelint vuelven a estar limpios." \
            --descripcion "HTML mal formado o CSS con errores (HTML-validate, Stylelint)" --color D93F0B
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calidad-html-css
          path: |
            muestra.txt
            html-validate.txt
            stylelint.txt
          if-no-files-found: ignore
          retention-days: 30
