name: Check content indexes

on:
  pull_request:
  workflow_dispatch:

jobs:
  content-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check RSS is generated from current articles
        run: python scripts/build-feed.py --check
      - name: Check sitemap is generated from canonical indexable HTML
        run: python scripts/build-sitemap.py --check
      - name: Check indexable pages are not orphaned
        run: python scripts/check-internal-graph.py
      - name: Check local asset references resolve to real files
        run: python scripts/check-local-assets.py
      - name: Check .assetsignore still matches the public-dist exclude list
        run: python scripts/build-public-dist.py --check-assetsignore
      - name: Check shared JSON-LD entities use one canonical @id
        run: python scripts/check-canonical-entity-ids.py
      - name: Check the pre-rendered article-tools block matches current headings
        run: python scripts/build-article-tools.py --check
      # Lighthouse no puede auditar robots.txt en las paginas con
      # `connect-src 'none'` (ver .github/workflows/lighthouse-ci.yml), asi que
      # la validacion real vive aqui: parsea el fichero, exige el sitemap
      # canonico y comprueba que cada bot de busqueda alcance las rutas clave.
      - name: Check robots.txt and AI/search crawler access
        run: python scripts/check-ai-discoverability.py
      - name: Check social cards (Open Graph / Twitter) on every indexable page
        run: python scripts/check-social-cards.py --strict
      - name: Check the editorial methodology page is date-independent
        run: python tests/test-editoriales-metodologia.py
      - name: Check published Spanish copy is not missing its accents
        run: python scripts/check-copy-tildes.py
      # Sin este check, un cambio en data/writer-tools.json (o en el propio
      # builder) puede fusionarse sin regenerar el HTML publicado, y nada lo
      # avisaria: paso exactamente eso con el CSP y el JSON-LD de esta pagina,
      # ausentes en el HTML desplegado aunque cada pagina hermana los lleva.
      - name: Check the curated writer-tools directory is up to date
        run: >
          python scripts/build-writer-tools.py data/writer-tools.json
          --output recursos/herramientas-para-escritores/index.html --check
      - name: Check the /herramientas/ hub is up to date
        run: python scripts/build-tools-hub.py data/tools-hub.json herramientas/index.html --check
      # El contrato "el texto no sale del navegador" es el argumento de venta
      # de cada herramienta de manuscrito. Este preflight existia
      # (scripts/audit-private-tools.py) pero nada lo ejecutaba en CI: una
      # regresion de CSP o un fetch() colado habria llegado a produccion sin
      # que ningun check se pusiera en rojo. Verificado que detecta una
      # regresion real antes de fiarse de el (ver el commit que lo activa).
      - name: Check manuscript tools keep their local-only privacy contract
        run: >
          python scripts/audit-private-tools.py
          herramientas/*/index.html
          clubes-de-lectura/preparar-sesion/index.html
          convocatorias-escritores/index.html
          recursos/ficha-historia-objeto-heredado/index.html
