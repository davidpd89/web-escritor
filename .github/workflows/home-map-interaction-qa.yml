name: Home masthead nav interaction QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/v1-home.css'
      - 'qa/home-map-interaction.mjs'
      - '.github/workflows/home-map-interaction-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/playwright-install-deps.sh full chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bash scripts/ci/playwright-install-deps.sh deps chromium
      - name: Materializar generados
        uses: ./.github/actions/materializar

      - name: Run masthead nav browser QA
        run: |
          set -e
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/home-map-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          node qa/home-map-interaction.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home-map-interaction-qa
          path: qa-artifacts/home-map/
          if-no-files-found: warn
          retention-days: 14
