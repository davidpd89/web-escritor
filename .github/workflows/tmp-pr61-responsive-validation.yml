name: Temporary PR61 responsive validation

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-pr61-responsive-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load immutable PR61 H.3 checker and test
        env:
          H3_SHA: 2bf6b4716e398c89beb084f5135d89255cc304e7
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/davidpd89/web-escritor/${H3_SHA}/scripts/check-responsive-images.py" \
            --output scripts/check-responsive-images.py
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/davidpd89/web-escritor/${H3_SHA}/tests/test-check-responsive-images.py" \
            --output tests/test-check-responsive-images.py
      - name: Run PR61 responsive image fixture tests
        run: python tests/test-check-responsive-images.py
      - name: Run PR61 responsive image checker on PR67 tree
        run: python scripts/check-responsive-images.py --check
