name: Cuaderno editorial browser QA

on:
  push:
    paths:
      - 'cuaderno/**'
      - 'assets/v1-editorial.css'
      - 'assets/v1-editorial.js'
      - 'assets/article-print.css'
      - 'assets/article-sources.css'
      - 'assets/article-tools.css'
      - 'assets/article-tools.js'
      - 'qa/cuaderno-browser.mjs'
      - '.github/workflows/cuaderno-browser-qa.yml'
  pull_request:
    paths:
      - 'cuaderno/**'
      - 'assets/v1-editorial.css'
      - 'assets/v1-editorial.js'
      - 'assets/article-print.css'
      - 'assets/article-sources.css'
      - 'assets/article-tools.css'
      - 'assets/article-tools.js'
      - 'qa/cuaderno-browser.mjs'
      - '.github/workflows/cuaderno-browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cuaderno-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/cuaderno/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cuaderno-http.log
          exit 1

      - name: Run Cuaderno browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node qa/cuaderno-browser.mjs

      - name: Check generated editorial outputs
        run: |
          python scripts/build-feed.py --check
          python scripts/build-sitemap.py --check
          python scripts/build-article-tools.py --check
          python scripts/build-topic-collections.py --data data/topic-collections.json --root . --check

      - name: Run Cuaderno WCAG2AA
        run: |
          npx pa11y-ci --config ./.pa11yci \
            http://127.0.0.1:4173/cuaderno/ \
            http://127.0.0.1:4173/cuaderno/feria-libro-madrid-2026-samuel-entre-mundos/ \
            http://127.0.0.1:4173/cuaderno/que-es-el-portal-fantasy/ \
            http://127.0.0.1:4173/cuaderno/portal-fantasy-vs-fantasia-epica/ \
            http://127.0.0.1:4173/cuaderno/sistema-de-magia-noveris/ \
            http://127.0.0.1:4173/cuaderno/fantasia-juvenil-espanola-portales-magia-coste/ \
            http://127.0.0.1:4173/cuaderno/libros-fantasia-juvenil-espanola-2025-2026/ \
            http://127.0.0.1:4173/cuaderno/worldbuilding-noveris-ciudad-magica/

      - name: Run Cuaderno Lighthouse
        run: |
          cat > /tmp/cuaderno-lhci.json <<'JSON'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://127.0.0.1:4173/cuaderno/",
                  "http://127.0.0.1:4173/cuaderno/que-es-el-portal-fantasy/",
                  "http://127.0.0.1:4173/cuaderno/feria-libro-madrid-2026-samuel-entre-mundos/"
                ],
                "numberOfRuns": 3,
                "settings": {"chromeFlags": "--no-sandbox"}
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.85, "aggregationMethod": "median"}],
                  "categories:accessibility": ["error", {"minScore": 0.97, "aggregationMethod": "median"}],
                  "categories:best-practices": ["warn", {"minScore": 0.95, "aggregationMethod": "median"}],
                  "categories:seo": ["error", {"minScore": 0.98, "aggregationMethod": "median"}],
                  "largest-contentful-paint": ["warn", {"maxNumericValue": 3500, "aggregationMethod": "median"}],
                  "cumulative-layout-shift": ["error", {"maxNumericValue": 0.1, "aggregationMethod": "pessimistic"}],
                  "total-blocking-time": ["warn", {"maxNumericValue": 400, "aggregationMethod": "median"}]
                }
              }
            }
          }
          JSON
          npx lhci collect --config=/tmp/cuaderno-lhci.json
          npx lhci assert --config=/tmp/cuaderno-lhci.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuaderno-editorial-evidence
          path: |
            qa-artifacts/cuaderno/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
