name: Identity public browser QA

on:
  push:
    branches:
      - gpt/identity-public-v1
    paths:
      - 'qa/identity-public-apply.py'
      - 'qa/identity-public-browser.mjs'
      - 'assets/v1-identity.css'
      - '.github/workflows/identity-public-browser-qa.yml'
  pull_request:
    paths:
      - 'autor.html'
      - 'prensa.html'
      - 'premios.html'
      - 'eventos.html'
      - 'assets/v1-identity.css'
      - 'qa/identity-public-apply.py'
      - 'qa/identity-public-browser.mjs'
      - '.github/workflows/identity-public-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identity-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply deterministic Identity migration
        run: python qa/identity-public-apply.py

      - name: Commit implementation on isolated branch
        if: github.event_name == 'push' && github.ref_name == 'gpt/identity-public-v1'
        shell: bash
        run: |
          set -euo pipefail
          git add -- autor.html prensa.html premios.html eventos.html
          if git diff --cached --quiet; then
            echo 'Identity HTML already migrated; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(identity): refine author press awards and events V1'
          git push origin HEAD:gpt/identity-public-v1

      - name: Migration idempotency check
        run: |
          python qa/identity-public-apply.py
          git diff --exit-code -- autor.html prensa.html premios.html eventos.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/identity-server.log 2>&1 &
          echo $! > /tmp/identity-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/autor.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/identity-server.log
          exit 1

      - name: Browser QA and screenshots
        env:
          IDENTITY_BASE_URL: http://127.0.0.1:4173
          IDENTITY_ARTIFACT_DIR: artifacts/identity-public
        run: node qa/identity-public-browser.mjs

      - name: Install Lighthouse CI
        if: always()
        run: npm install --global @lhci/cli@0.15.1

      - name: Configure Identity Lighthouse
        if: always()
        shell: bash
        run: |
          cat > /tmp/identity-lighthouserc.json <<'JSON'
          {
            "ci": {
              "collect": {
                "staticDistDir": "./",
                "url": [
                  "http://localhost/autor.html",
                  "http://localhost/prensa.html",
                  "http://localhost/premios.html",
                  "http://localhost/eventos.html"
                ],
                "numberOfRuns": 1,
                "settings": { "chromeFlags": "--no-sandbox" }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.85 }],
                  "categories:accessibility": ["error", { "minScore": 0.97 }],
                  "categories:best-practices": ["warn", { "minScore": 0.95 }],
                  "categories:seo": ["error", { "minScore": 0.98 }],
                  "largest-contentful-paint": ["warn", { "maxNumericValue": 3500 }],
                  "cumulative-layout-shift": ["error", { "maxNumericValue": 0.1 }],
                  "total-blocking-time": ["warn", { "maxNumericValue": 400 }]
                }
              }
            }
          }
          JSON

      - name: Lighthouse collect
        if: always()
        run: lhci collect --config=/tmp/identity-lighthouserc.json

      - name: Lighthouse assert
        if: always()
        run: lhci assert --config=/tmp/identity-lighthouserc.json

      - name: Save server log
        if: always()
        run: |
          mkdir -p artifacts/identity-public
          cp /tmp/identity-server.log artifacts/identity-public/server.log || true

      - name: Upload Identity QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-public-qa
          path: |
            artifacts/identity-public/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
