name: Manecillas funnel QA

on:
  pull_request:
    paths:
      - 'las-manecillas-del-recuerdo/**'
      - 'assets/manecillas-funnel.js'
      - 'script.js'
      - 'qa/manecillas-funnel-browser.mjs'
      - '.github/workflows/manecillas-funnel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Manecillas funnel browser QA
        run: node qa/manecillas-funnel-browser.mjs
