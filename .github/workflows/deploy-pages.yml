name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build public artifact (allowlist-first)
        run: python scripts/build-public-dist.py --out .preview-dist

      - name: Verify built artifact satisfies the public-artifact contract
        run: python scripts/build-public-dist.py --check-contents --out .preview-dist

      - name: Stop Pages from Jekyll-processing the artifact
        run: touch .preview-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production after deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Smoke test public production surface
        env:
          SITE_BASE_URL: https://davidportodiaz.com
          CANONICAL_ORIGIN: https://davidportodiaz.com
          SMOKE_LABEL: PRODUCTION
        shell: bash
        run: |
          # GitHub Pages/CDN propagation can take a few seconds after the
          # deployment action returns. Retry the complete deterministic smoke
          # a bounded number of times; never disable TLS and never turn a real
          # persistent failure into a warning.
          for attempt in 1 2 3; do
            echo "Production verification attempt ${attempt}/3"
            if node tests/test-staging-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "Production verification failed after 3 attempts."
          exit 1
