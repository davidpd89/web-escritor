name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build public artifact (allowlist-first)
        run: python scripts/build-public-dist.py --out .preview-dist

      - name: Verify built artifact satisfies the public-artifact contract
        run: python scripts/build-public-dist.py --check-contents --out .preview-dist

      - name: Derive changed public URLs for IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/indexnow-urls.json"
          if [ "$EVENT_NAME" != "push" ] || [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/indexnow.py empty --output "$out"
            exit 0
          fi

          before_root="$RUNNER_TEMP/indexnow-before-src"
          before_dist="$RUNNER_TEMP/indexnow-before-dist"
          git worktree add --detach "$before_root" "$BEFORE_SHA"
          python "$before_root/scripts/build-public-dist.py" --out "$before_dist"
          python scripts/indexnow.py derive \
            --before-dist "$before_dist" \
            --before-registry "$before_root/data/content-registry.json" \
            --after-dist .preview-dist \
            --after-registry data/content-registry.json \
            --output "$out"
          git worktree remove --force "$before_root"

      - name: Upload IndexNow change set
        uses: actions/upload-artifact@v6
        with:
          name: indexnow-change-set
          path: ${{ runner.temp }}/indexnow-urls.json
          if-no-files-found: error
          retention-days: 7

      - name: Stamp exact release identity
        run: |
          python scripts/stamp-release-identity.py --out .preview-dist --sha "$GITHUB_SHA"
          python scripts/stamp-release-identity.py --check --out .preview-dist --sha "$GITHUB_SHA"

      - name: Stop Pages from Jekyll-processing the artifact
        run: touch .preview-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    name: Verify production after deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Smoke test exact public production release
        env:
          SITE_BASE_URL: https://davidportodiaz.com
          CANONICAL_ORIGIN: https://davidportodiaz.com
          SMOKE_LABEL: PRODUCTION
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # GitHub Pages/CDN propagation can take a few seconds after the
          # deployment action returns. Retry the complete deterministic smoke
          # a bounded number of times. The per-SHA marker path means an older
          # but otherwise healthy release cannot satisfy this check.
          for attempt in 1 2 3; do
            echo "Production verification attempt ${attempt}/3 for ${EXPECTED_RELEASE_SHA}"
            if node tests/test-staging-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "Production verification failed after 3 attempts."
          exit 1

  notify-indexnow:
    name: Notify IndexNow after verified deploy
    needs:
      - build
      - verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download IndexNow change set
        uses: actions/download-artifact@v8
        with:
          name: indexnow-change-set
          path: .indexnow

      - name: Verify public IndexNow ownership key
        shell: bash
        run: |
          set -euo pipefail
          key_file="59347d39b5684876a7ccc84382f31758.txt"
          expected="$(tr -d '\r\n' < "$key_file")"
          actual="$(curl --fail --silent --show-error --max-time 20 "https://davidportodiaz.com/$key_file" | tr -d '\r\n')"
          if [ "$actual" != "$expected" ]; then
            echo "IndexNow ownership key mismatch in production."
            exit 1
          fi
          echo "IndexNow ownership key is live and matches the deployed contract."

      - name: Submit changed URLs to IndexNow
        run: |
          python scripts/indexnow.py submit \
            --url-file .indexnow/indexnow-urls.json \
            --key-file 59347d39b5684876a7ccc84382f31758.txt
