name: Deploy Pages

on:
  push:
    branches:
      - main
  # Cambio de día (D1, R4-4): a las 00:05 de Madrid se vuelve a publicar con la fecha nueva aunque no haya
  # commits (novedades, próximos, ofertas). GitHub usa UTC: 22:05 en verano y 23:05 en invierno; el job «dia»
  # descarta la que cae a las 23 de Madrid (aún el día anterior). Un retraso de GitHub no la pierde.
  schedule:
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      before_sha:
        description: 'Previous main commit for a validated automatic merge (IndexNow)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # De los dos horarios, solo publica el que corresponde a las 00:05 de Madrid (22:05 UTC en verano, 23:05 en
  # invierno), decidido por el cron que disparó y el horario vigente, no por la hora de llegada: un retraso de
  # GitHub no lo pierde y en verano no se publica dos veces. Push y manuales, siempre.
  dia:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      hoy: ${{ steps.dia.outputs.hoy }}
      seguir: ${{ steps.dia.outputs.seguir }}
    steps:
      - name: Día del despliegue (Madrid)
        id: dia
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          echo "hoy=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"
          seguir=true
          if [ "$EVENT_NAME" = schedule ]; then
            # +0200 verano: vale el de las 22 UTC; +0100 invierno: el de las 23 UTC.
            if [ "$(TZ=Europe/Madrid date +%z)" = +0200 ]; then propio='5 22 * * *'; else propio='5 23 * * *'; fi
            [ "$CRON" = "$propio" ] || seguir=false
          fi
          echo "seguir=$seguir" >> "$GITHUB_OUTPUT"

  build:
    needs: dia
    if: needs.dia.outputs.seguir == 'true'
    # La concurrencia va en el build, no en el workflow: un disparo descartado no cancela un despliegue por push.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25  # rehacer la cadena con el día (~4-8 min) además de construir y subir
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # La cadena (build-reading-catalogue.py) importa Pillow: en un runner limpio no está.
      - name: Dependencias Python
        run: python -m pip install -r scripts/requirements.txt

      - name: Materializar generados
        uses: ./.github/actions/materializar

      # Lo que depende del día (portal, páginas, próximos, ofertas, descuentos caducados) se rehace con la fecha
      # de Madrid de hoy, no con la de los datos del último commit: así el día cambia aunque una noche no haya
      # carga. Toda la cadena (shell, sitemap, Pagefind) para que nada quede del día anterior.
      # Pagefind (último eslabón de la cadena) se ejecuta con `npx --no-install pagefind`: hace falta Node y el
      # node_modules del lockfile. Sin scripts de instalación: el binario de Pagefind va en un paquete opcional.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Instalar Pagefind (lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rehacer lo generado con el día de hoy
        env:
          CATALOGO_HOY: ${{ needs.dia.outputs.hoy }}
        run: python scripts/materializar_generados.py --solo-construir

      - name: Build public artifact (allowlist-first)
        run: python scripts/build-public-dist.py --out .preview-dist

      # R5-6: la instantánea social vive en la rama social-estado; se superpone la más reciente válida.
      - name: Overlay social snapshot from social-estado
        run: python scripts/social_estado.py --out .preview-dist

      - name: Verify built artifact satisfies the public-artifact contract
        run: python scripts/build-public-dist.py --check-contents --out .preview-dist

      - name: Derive changed public URLs for IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || inputs.before_sha }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/indexnow-urls.json"
          if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            python scripts/indexnow.py empty --output "$out"
            exit 0
          fi
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BEFORE_SHA" HEAD

          before_root="$RUNNER_TEMP/indexnow-before-src"
          before_dist="$RUNNER_TEMP/indexnow-before-dist"
          git worktree add --detach "$before_root" "$BEFORE_SHA"
          # Tras el corte, el árbol «antes» no trae lo generado: se materializa igual que el actual (antes del
          # corte, --asegurar no hace nada; un commit anterior a --asegurar trae lo generado versionado).
          if grep -q -- '--asegurar' "$before_root/scripts/materializar_generados.py" 2>/dev/null; then
            (cd "$before_root" && GITHUB_OUTPUT=/dev/null python scripts/materializar_generados.py --asegurar)
          fi
          python "$before_root/scripts/build-public-dist.py" --out "$before_dist"
          python scripts/indexnow.py derive \
            --before-dist "$before_dist" \
            --before-registry "$before_root/data/content-registry.json" \
            --after-dist .preview-dist \
            --after-registry data/content-registry.json \
            --output "$out"
          git worktree remove --force "$before_root"

      - name: Upload IndexNow change set
        uses: actions/upload-artifact@v6
        with:
          name: indexnow-change-set
          path: ${{ runner.temp }}/indexnow-urls.json
          if-no-files-found: error
          retention-days: 7

      # /version.json {sha, hoy}: qué commit y qué día de Madrid están publicados (R5-13, vigilancia del día).
      - name: Stamp exact release identity
        env:
          CATALOGO_HOY: ${{ needs.dia.outputs.hoy }}
        run: |
          python scripts/stamp-release-identity.py --out .preview-dist --sha "$GITHUB_SHA" --hoy "$CATALOGO_HOY"
          python scripts/stamp-release-identity.py --check --out .preview-dist --sha "$GITHUB_SHA" --hoy "$CATALOGO_HOY"

      - name: Stop Pages from Jekyll-processing the artifact
        run: touch .preview-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .preview-dist

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false  # un despliegue a medias no se corta; el siguiente espera
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # La verificación va en este job: el grupo pages-deploy solo cubre `deploy` y, en un job aparte, otro
      # despliegue podía publicar un SHA más nuevo antes de verificar este (#1391).
      - name: Checkout deployed SHA
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Smoke test exact public production release
        env:
          SITE_BASE_URL: https://davidportodiaz.com
          CANONICAL_ORIGIN: https://davidportodiaz.com
          SMOKE_LABEL: PRODUCTION
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # GitHub Pages/CDN propagation can take a few seconds after the
          # deployment action returns. Retry the complete deterministic smoke
          # a bounded number of times. The per-SHA marker path means an older
          # but otherwise healthy release cannot satisfy this check.
          for attempt in 1 2 3; do
            echo "Production verification attempt ${attempt}/3 for ${EXPECTED_RELEASE_SHA}"
            if node tests/test-staging-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "Production verification failed after 3 attempts."
          exit 1

  notify-indexnow:
    name: Notify IndexNow after verified deploy
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download IndexNow change set
        uses: actions/download-artifact@v8
        with:
          name: indexnow-change-set
          path: .indexnow

      - name: Verify public IndexNow ownership key
        shell: bash
        run: |
          set -euo pipefail
          key_file="59347d39b5684876a7ccc84382f31758.txt"
          expected="$(tr -d '\r\n' < "$key_file")"
          actual="$(curl --fail --silent --show-error --max-time 20 "https://davidportodiaz.com/$key_file" | tr -d '\r\n')"
          if [ "$actual" != "$expected" ]; then
            echo "IndexNow ownership key mismatch in production."
            exit 1
          fi
          echo "IndexNow ownership key is live and matches the deployed contract."

      - name: Submit changed URLs to IndexNow
        run: |
          python scripts/indexnow.py submit \
            --url-file .indexnow/indexnow-urls.json \
            --key-file 59347d39b5684876a7ccc84382f31758.txt
