name: Pinterest RSS offline validation

on:
  pull_request:
    paths:
      - 'scripts/build-reading-pinterest-rss.py'
      - 'scripts/export-reading-pinterest-plan.py'
      - 'data/reading-pinterest-boards.json'
      - 'assets/pinterest/feeds/*.xml'
      - 'tests/test_reading_pinterest_rss.py'
      - '.github/workflows/reading-pinterest-rss-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile generator and tests
        run: python -m compileall -q scripts/build-reading-pinterest-rss.py tests/test_reading_pinterest_rss.py
      - name: Validate RSS offline — no Pinterest account, no tokens
        run: python -m unittest discover -s tests -p 'test_reading_pinterest_rss.py' -v
      - name: Check tracked EMPTY RSS files before activation
        run: python scripts/build-reading-pinterest-rss.py --check --today 2026-10-20
      - name: Preview current catalogue without publication
        run: python scripts/build-reading-pinterest-rss.py --preview --today 2026-10-20
      - name: Generate feeds in ephemeral CI runner (NEVER deploy)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/reading-pinterest-boards.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["rss_enabled"] = True  # isolated runner, never committed
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/build-reading-pinterest-rss.py --assign --today 2026-10-20
          python scripts/build-reading-pinterest-rss.py --check --today 2026-10-20
          python scripts/export-reading-pinterest-plan.py --today 2026-10-20 --out .ci/reading-pinterest/manual-plan.json
          python scripts/build-reading-pinterest-rss.py --assign --today 2026-10-20
          python scripts/build-reading-pinterest-rss.py --check --today 2026-10-20
