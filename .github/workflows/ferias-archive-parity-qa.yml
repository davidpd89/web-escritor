name: Ferias archive parity QA

on:
  pull_request:
    paths:
      - 'ferias.html'
      - 'assets/v1-ferias.css'
      - 'sitemap.xml'
      - 'tests/test-ferias-parity.py'
      - 'qa/ferias-archive-browser.mjs'
      - '.github/workflows/ferias-archive-parity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(ferias\.html|assets/v1-ferias\.css|sitemap\.xml|tests/test-ferias-parity\.py|qa/ferias-archive-browser\.mjs|\.github/workflows/ferias-archive-parity-qa\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in Ferias PR:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Static archive parity contract
        run: python tests/test-ferias-parity.py

      - name: Generated sitemap parity
        run: python scripts/build-sitemap.py --check

  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/ferias-server.log 2>&1 &
          echo $! > /tmp/ferias-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ferias.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ferias-server.log
          exit 1

      - name: Responsive, accessibility and deep-link QA
        env:
          FERIAS_BASE_URL: http://127.0.0.1:4173
          FERIAS_ARTIFACT_DIR: artifacts/ferias-archive
        run: node qa/ferias-archive-browser.mjs

      - name: Install Lighthouse CI
        if: always()
        run: npm install --global @lhci/cli@0.15.1

      - name: Configure Ferias Lighthouse
        if: always()
        shell: bash
        run: |
          cat > /tmp/ferias-lighthouserc.json <<'JSON'
          {
            "ci": {
              "collect": {
                "staticDistDir": "./",
                "url": ["http://localhost/ferias.html"],
                "numberOfRuns": 1,
                "settings": { "chromeFlags": "--no-sandbox" }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.85 }],
                  "categories:accessibility": ["error", { "minScore": 0.97 }],
                  "categories:best-practices": ["warn", { "minScore": 0.95 }],
                  "categories:seo": ["error", { "minScore": 0.98 }],
                  "largest-contentful-paint": ["warn", { "maxNumericValue": 3500 }],
                  "cumulative-layout-shift": ["error", { "maxNumericValue": 0.1 }],
                  "total-blocking-time": ["warn", { "maxNumericValue": 400 }]
                }
              }
            }
          }
          JSON

      - name: Lighthouse collect
        if: always()
        run: lhci collect --config=/tmp/ferias-lighthouserc.json

      - name: Lighthouse assert
        if: always()
        run: lhci assert --config=/tmp/ferias-lighthouserc.json

      - name: Save server log
        if: always()
        run: |
          mkdir -p artifacts/ferias-archive
          cp /tmp/ferias-server.log artifacts/ferias-archive/server.log || true

      - name: Upload Ferias QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferias-archive-parity-qa
          path: |
            artifacts/ferias-archive/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
