name: Convocatorias browser QA

on:
  pull_request:
    paths:
      - 'convocatorias-escritores/**'
      - 'assets/radar-convocatorias.css'
      - 'assets/radar-convocatorias.js'
      - 'assets/v1-tools.css'
      - 'scripts/build-radar-opportunities.py'
      - 'data/radar-opportunities.json'
      - 'qa/convocatorias-design-browser.mjs'
      - 'qa/pro-resources-browser.mjs'
      - '.github/workflows/convocatorias-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Validate radar dataset at fixed QA date
        run: python3 scripts/build-radar-opportunities.py --data data/radar-opportunities.json --out /tmp/convocatorias-check --today 2026-08-21 --check

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/convocatorias-qa-server.log 2>&1 &
          echo $! > /tmp/convocatorias-qa-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/convocatorias-escritores/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/convocatorias-qa-server.log
          exit 1

      - name: Run professional resources functional authority
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/convocatorias-functional
        run: node qa/pro-resources-browser.mjs

      - name: Capture Convocatorias inherited baseline
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: qa-artifacts/convocatorias-design
        run: node qa/convocatorias-design-browser.mjs

      - name: Upload Convocatorias baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convocatorias-visual-evidence
          path: |
            qa-artifacts/convocatorias-design/
            qa-artifacts/convocatorias-functional/
          if-no-files-found: warn
          retention-days: 14
