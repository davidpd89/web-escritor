name: Manecillas buy CTA QA

on:
  pull_request:
    paths:
      - 'las-manecillas-del-recuerdo/**'
      - 'assets/v1-home-editorial-v3.js'
      - 'assets/v1-shell.js'
      - 'script.js'
      - 'editorial-facts.json'
      - 'qa/manecillas-buy-cta-contract.mjs'
      - '.github/workflows/manecillas-buy-cta-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buy-cta-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Manecillas buy CTA contract QA
        run: node qa/manecillas-buy-cta-contract.mjs
