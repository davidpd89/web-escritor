name: Production smoke monitor

on:
  pull_request:
    paths:
      - "tests/test-staging-smoke.mjs"
      - ".github/workflows/production-smoke-monitor.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run read-only production smoke
        env:
          SITE_BASE_URL: https://davidportodiaz.com
          CANONICAL_ORIGIN: https://davidportodiaz.com
          SMOKE_LABEL: PRODUCTION-MONITOR
        shell: bash
        run: |
          # Reuse the same deterministic GET-only smoke as the post-deploy gate.
          # Two attempts reduce noise from brief network/CDN transients without
          # introducing persistent state, credentials or a second checker.
          for attempt in 1 2; do
            echo "Production monitor attempt ${attempt}/2"
            if node tests/test-staging-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              sleep 30
            fi
          done
          echo "Production monitor failed after 2 attempts."
          exit 1
