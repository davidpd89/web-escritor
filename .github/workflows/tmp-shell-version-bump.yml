name: Temporary shell asset version regeneration

on:
  push:
    branches:
      - audit/postdeploy-new-gaps-20261006
    paths:
      - 'assets/v1-shell.js'
      - 'scripts/bump-v1-shell-version.py'
      - '.github/workflows/tmp-shell-version-bump.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: audit/postdeploy-new-gaps-20261006
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate shell asset version references
        run: python scripts/bump-v1-shell-version.py

      - name: Validate generated references
        run: |
          python scripts/check-asset-versions.py
          git diff --check

      - name: Commit regenerated references
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No regeneration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(assets): regenerate v1 shell cache version"
          git push origin "HEAD:refs/heads/audit/postdeploy-new-gaps-20261006"
