name: Refresh radar clock outputs

on:
  schedule:
    # Europe/Madrid midnight is 22:00 UTC in CEST and 23:00 UTC in CET.
    # The earlier run is a no-op in winter; the later run is a no-op in summer.
    - cron: '20 22 * * *'
    - cron: '20 23 * * *'
    # Backups: GitHub delays nightly crons by hours and a failed run (one
    # external link timeout) must not leave main stale until the next day.
    # They are no-ops while the radar is current.
    - cron: '50 1 * * *'
    - cron: '20 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-clock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: refresh-radar-clock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fast-forward to authoritative main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve Madrid civil date and detect clock drift
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          today="$(python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from site_clock import site_today
          print(site_today().isoformat())
          PY
          )"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if python scripts/check-radar-clock-current.py --today "$today"; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate deterministic radar outputs
        if: steps.clock.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-radar-opportunities.py \
            --data data/radar-opportunities.json \
            --out convocatorias-escritores \
            --today "${{ steps.clock.outputs.today }}"

      - name: Detect whether searchable HTML changed
        if: steps.clock.outputs.refresh == 'true'
        id: html
        shell: bash
        run: |
          if git diff --quiet -- convocatorias-escritores/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for Pagefind
        if: steps.html.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pinned Pagefind dependency
        if: steps.html.outputs.changed == 'true'
        run: npm ci

      - name: Rebuild Pagefind only when radar HTML changed
        if: steps.html.outputs.changed == 'true'
        run: python scripts/build-pagefind-index.py

      - name: Validate regenerated artifacts
        if: steps.clock.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-radar-clock-current.py --today "${{ steps.clock.outputs.today }}"
          python scripts/check-professional-resources.py
          python scripts/build-pagefind-index.py --check
          git diff --check

      - name: Enforce generated-file allowlist
        if: steps.clock.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              convocatorias-escritores/index.html|convocatorias-escritores/opportunities.json|convocatorias-escritores/deadlines.ics|pagefind/*)
                ;;
              *)
                echo "Unexpected generated change: $path"
                bad=1
                ;;
            esac
          done < <(git diff --name-only)
          exit "$bad"

      - name: Publish refresh branch and pull request
        if: steps.clock.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated change after refresh."
            exit 0
          fi

          # A previous clock refresh may still have an open PR. Runs are
          # serialized (no cancellation), so a same-day PR here belongs to a
          # finished, failed run: close it before writing a fresh one.
          python scripts/radar_pr_guard.py --supersede-stale --today "${{ steps.clock.outputs.today }}"

          today="${{ steps.clock.outputs.today }}"
          branch="automation/radar-clock-${today}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- \
            convocatorias-escritores/index.html \
            convocatorias-escritores/opportunities.json \
            convocatorias-escritores/deadlines.ics \
            pagefind/
          git commit -m "chore(resources): refresh radar clock ${today}"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(resources): refresh radar clock ${today}" \
            --body "Actualización automática del radar al día civil de Madrid \`${today}\`. Solo artefactos deterministas permitidos y Pagefind cuando cambia el HTML. Se ejecutan explícitamente las pruebas sobre este commit; solo se fusiona si todas pasan y las reglas de main lo permiten. Después se solicita el despliegue de Pages. Si alguna fase falla, la ejecución queda en rojo."

          # GITHUB_TOKEN does not start normal PR/push CI. Dispatch real CI
          # explicitly, wait for every result, merge through main rules and
          # explicitly dispatch Pages. A failed phase fails this job too.
          python scripts/publish-radar-refresh.py --branch "$branch"
