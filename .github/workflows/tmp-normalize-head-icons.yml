name: Temporary head icon normalization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-head-icons.py'
      - '.github/workflows/tmp-normalize-head-icons.yml'

permissions:
  contents: write

concurrency:
  group: temporary-head-icon-normalization
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fast-forward to latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Normalize favicon and touch-icon declarations
        run: |
          python scripts/check-head-icons.py --write
          python scripts/check-head-icons.py --check
          git diff --check

      - name: Commit deterministic normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No head-icon normalization needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'scripts/*.py'
          git commit -m "perf: use lightweight favicon assets sitewide"
          git push origin HEAD:main
