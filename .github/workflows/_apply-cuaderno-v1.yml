name: Apply Cuaderno V1 migration

on:
  push:
    branches:
      - gpt/cuaderno-editorial-v1
    paths:
      - 'scripts/_apply-cuaderno-v1.py'
      - '.github/workflows/_apply-cuaderno-v1.yml'
  pull_request:
    types: [opened, synchronize]
    branches:
      - implementacion-web-2026
    paths:
      - 'scripts/_apply-cuaderno-v1.py'
      - '.github/workflows/_apply-cuaderno-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cuaderno-editorial-v1
          fetch-depth: 0

      - name: Apply asserted migration
        run: python scripts/_apply-cuaderno-v1.py

      - name: Remove migration-only files
        run: rm scripts/_apply-cuaderno-v1.py .github/workflows/_apply-cuaderno-v1.yml

      - name: Commit scoped result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cuaderno assets/v1-editorial.css assets/v1-editorial.js qa/cuaderno-browser.mjs .github/workflows/cuaderno-browser-qa.yml scripts/_apply-cuaderno-v1.py .github/workflows/_apply-cuaderno-v1.yml
          git diff --cached --check
          git commit -m "feat(cuaderno): refine editorial article system V1"
          git push origin HEAD:gpt/cuaderno-editorial-v1
