name: CSP public shell QA

on:
  pull_request:
    # Vía rápida: un PR solo de contenido generado (scripts/ci_content_lane.py CONTENT_GLOBS) no lo dispara; lo cubre weekly-full-audit.yml.
    paths-ignore:
      - 'assets/page-order.generated.js'
      - 'assets/reading-market.json'
      - 'assets/reading-covers/isbn-*.webp'
      - 'assets/reading-audio/*.mp3'
      - 'assets/pinterest/feeds/*.xml'
      - 'data/reading-catalogue.json'
      - 'data/reading-authors.json'
      - 'data/reading-publishers.json'
      - 'data/reading-intake-state.json'
      - 'data/reading-pinterest-state.json'
      - 'data/reading-texts/*.json'
      - 'data/content-registry.json'
      - 'recomendaciones/index.html'
      - 'recomendaciones/autores/index.html'
      - 'recomendaciones/editoriales/index.html'
      - 'recomendaciones/libros/*/index.html'
      - 'recomendaciones/autores/*/index.html'
      - 'recomendaciones/editoriales/*/index.html'
      - 'recomendaciones/proximos-lanzamientos.ics'
      - 'recomendaciones/llms.txt'
      - 'recomendaciones/ofertas.json'
      - 'editoriales/*/index.html'
      - 'editoriales-sitemap.xml'
      - 'mapa-del-sitio/index.html'
      - 'sitemap.xml'
      - 'pagefind/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  csp-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check public shell is generated from navigation contract
        run: python3 scripts/build-site-shell.py --check

      - name: Run CSP browser QA
        run: node qa/csp-public-shell-browser.mjs
