name: Catalogue failure resilience (advisory)

on:
  pull_request:
    paths:
      - 'assets/reading-catalogue.*'
      - 'assets/reading-market.json'
      - 'assets/v1-shell.js'
      - 'recomendaciones/**'
      - 'data/reading-catalogue.json'
      - 'qa/reading-failure-resilience-browser.mjs'
      - '.github/workflows/reading-failure-resilience.yml'
  push:
    branches: [main]
    paths:
      - 'assets/reading-catalogue.*'
      - 'assets/reading-market.json'
      - 'recomendaciones/**'
      - 'data/reading-catalogue.json'
      - 'qa/reading-failure-resilience-browser.mjs'
      - '.github/workflows/reading-failure-resilience.yml'
  schedule:
    - cron: '41 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-failure-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    name: Catalogue controlled failures (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing browser dependencies
        run: npm ci
      - uses: actions/cache@v5
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install browser and OS dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install OS dependencies for cached browser
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Start isolated local site
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/reading-resilience-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4175/recomendaciones/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reading-resilience-server.log
          exit 1
      - name: Run controlled market and script failures
        run: node qa/reading-failure-resilience-browser.mjs
      - name: Publish readable findings
        if: always()
        run: |
          if [ -f .ci/reading-resilience/report.md ]; then
            cat .ci/reading-resilience/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalogue-failure-resilience
          path: .ci/reading-resilience/
          if-no-files-found: warn
          retention-days: 30
