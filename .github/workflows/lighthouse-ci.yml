name: Lighthouse CI

# Notas sobre lighthouserc.json (JSON no admite comentarios, asi que van aqui):
#
# --- Por que hay assertMatrix y no una sola lista de assertions
#
# Lighthouse descarga /robots.txt desde el contexto de la pagina auditada. Las
# paginas de herramientas declaran `connect-src 'none'` en su CSP porque
# prometen que el texto del usuario no sale del navegador, y esa CSP bloquea
# tambien la peticion de Lighthouse, que lo reporta como "unable to download a
# robots.txt file". Ese unico audit hunde la categoria SEO de esas rutas a 0,92.
#
# Comprobado: cambiando solo esa directiva a `connect-src 'self'` en una copia
# de /herramientas/manuscrito/, el SEO sube a 1,00 sin tocar nada mas. No es un
# fallo del sitio; es una medicion imposible en esas paginas, y relajar la CSP
# para complacer al auditor romperia la garantia de privacidad que la pagina
# anuncia.
#
# La primera version de este arreglo ponia `robots-txt: off` en la lista global
# y no servia de nada: desactivar la assertion de un audit no cambia la
# PUNTUACION de la categoria, que Lighthouse calcula con ese audit dentro. Por
# eso las rutas de herramienta van en su propio grupo, con `categories:seo`
# apagada y, a cambio, los ocho audits de SEO que si son medibles exigidos uno a
# uno en error. Sale un control mas estricto que la nota agregada, no mas laxo.
#
# robots.txt no se queda sin verificar: scripts/check-ai-discoverability.py lo
# valida en content-index-check.yml con mas rigor que Lighthouse (lo parsea con
# urllib.robotparser, exige el sitemap canonico y comprueba que cada bot de
# busqueda pueda rastrear las rutas clave).
#
# --- Por que best-practices esta en warn y no se persigue
#
# Sale 0,82 en casi todas las paginas y siempre por lo mismo: `is-on-https`,
# que pesa 5 puntos. LHCI sirve el sitio en http://localhost, asi que el audit
# no puede pasar aqui aunque el sitio en produccion sea HTTPS. Es un artefacto
# del laboratorio, no un defecto: no hay nada que arreglar en las paginas.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This check is a required ruleset context, so it must post a result on
      # every PR -- a path-filtered `on.pull_request.paths` trigger would mean
      # a docs-only PR never gets this check at all, which GitHub then shows
      # as permanently "Expected", blocking merge instead of passing it. So
      # the workflow trigger has no path filter and instead this step decides,
      # per PR, whether the surface Lighthouse actually measures changed --
      # every later step is gated on that instead of on the trigger.
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -qE '\.(html|css|js)$|^assets/|^manifest\.json$|^service-worker\.js$|^lighthouserc\.json$|^\.github/workflows/lighthouse-ci\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No HTML/CSS/JS/assets changes -- skipping Lighthouse
        if: steps.changes.outputs.relevant != 'true'
        run: echo "This PR doesn't touch any surface Lighthouse measures. Passing without running it."

      - name: Set up Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        if: steps.changes.outputs.relevant == 'true'
        run: npm install --global @lhci/cli@0.15.1

      # collect y assert van separados a proposito: con `lhci autorun`, un fallo
      # de assertions terminaba el proceso antes de los pasos siguientes.
      - name: Collect Lighthouse reports
        if: steps.changes.outputs.relevant == 'true'
        run: lhci collect --config=./lighthouserc.json

      - name: Upload reports to temporary public storage
        if: always() && steps.changes.outputs.relevant == 'true'
        continue-on-error: true
        run: lhci upload --config=./lighthouserc.json

      - name: Assert budgets
        if: steps.changes.outputs.relevant == 'true'
        run: lhci assert --config=./lighthouserc.json

      # include-hidden-files es imprescindible, no decorativo: LHCI deja los
      # informes en `.lighthouseci/`, y upload-artifact@v4 ignora por defecto
      # todo lo que empiece por punto. De ahi el "No files were found with the
      # provided path" de los runs anteriores — el directorio existia y estaba
      # lleno; la accion no lo miraba.
      - name: Upload local Lighthouse reports
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
