          QA_OUT: artifacts/sitewide-reflow
          TARGET_SIZE_MODE: enforce
          TEXT_RESILIENCE_MODE: report
          FOCUS_OBSCURED_MODE: enforce
        run: node qa/sitewide-reflow-browser.mjs

      - name: Enforce F.2 text-resilience findings
        env:
          TEXT_RESILIENCE_GATE_MODE: enforce
        run: node qa/text-resilience-report-gate.mjs

      - name: Books index visual-system QA
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/books-index-design-browser.mjs

      - name: Manecillas visual-system QA
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/manecillas-design-browser.mjs

