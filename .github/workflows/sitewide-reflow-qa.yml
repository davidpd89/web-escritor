name: Sitewide Reflow QA

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.css'
      - 'assets/**/*.js'
      - 'assets/**/*.mjs'
      - 'data/content-registry.json'
      - 'data/navigation.json'
      - 'scripts/build-*.py'
      - 'scripts/site_shell.py'
      - 'qa/*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sitewide-reflow-qa.yml'
  workflow_dispatch:
  schedule:
    # Auditoria completa de main fuera del camino de cada PR.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Franja de fichas de este run: en main, la que lleva más tiempo sin auditarse (deja el artefacto
  # reflow-rotation-slot-<n> para los runs siguientes); en un PR, run_number % K. Nunca falla.
  rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      slot: ${{ steps.pick.outputs.slot }}
    steps:
      - name: Checkout script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci_reflow_rotation.py
          sparse-checkout-cone-mode: false

      - name: Pick slot and report coverage of the last completed runs
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REFLOW_DETAIL_ROTATION: '7'
        run: python3 scripts/ci_reflow_rotation.py

      - name: Record slot for the next runs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: reflow-rotation-slot-${{ steps.pick.outputs.slot }}
          path: reflow-rotation.json
          retention-days: 30

  reflow-shard:
    name: reflow shard ${{ matrix.shard }}/8
    needs: rotation
    runs-on: ubuntu-24.04
    # Auditoria completa: 38-45 min por shard el 06/11; 45 cancelaba shards sanos. El paso ya admitia 70.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          fetch-depth: 0

      - name: Select reflow scope (deterministic, no AI)
        id: sel
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci-select-reflow.py

      - name: Content lane (solo contenido generado => muestra de páginas)
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        # Decide la copia de la rama base (clasificador y política): un PR no puede cambiar las reglas que lo
        # evalúan. Si la base aún no tiene vía rápida, auditoría completa.
        run: |
          base="$RUNNER_TEMP/lane-base"; mkdir -p "$base"
          if git archive "${BASE_SHA:-origin/main}" scripts | tar -x -C "$base" && [ -f "$base/scripts/ci_content_lane.py" ]; then
            LANE_ROOT="$PWD" python3 "$base/scripts/ci_content_lane.py"
          else
            echo "lane=full | la base no tiene scripts/ci_content_lane.py"
            printf 'lane=full\nroutes=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.sel.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install CI/QA dependencies (Node)
        if: steps.sel.outputs.run == 'true'
        run: npm ci

      - name: F.2 report classifier unit tests
        if: steps.sel.outputs.run == 'true'
        run: node qa/text-resilience-report-gate.test.mjs

      - name: Target-size geometry unit tests (F.1)
        if: steps.sel.outputs.run == 'true'
        run: node --test qa/target-size-audit.test.mjs qa/reflow-detail-rotation.test.mjs

      - name: Cache Playwright browsers
        if: steps.sel.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.sel.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/playwright-install-deps.sh full chromium

      - name: Install Playwright OS deps only (browser cached)
        if: steps.sel.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: bash scripts/ci/playwright-install-deps.sh deps chromium

      - name: Materializar generados
        if: steps.sel.outputs.run == 'true'
        uses: ./.github/actions/materializar

      - name: Start static server
        if: steps.sel.outputs.run == 'true'
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/reflow-server.log 2>&1 &
          echo $! > /tmp/reflow-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reflow-server.log
          exit 1

      - name: Run sitewide reflow gate + target-size gate + F.2 collector + F.4 focus-not-obscured gate
        if: steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
          TARGET_SIZE_MODE: enforce
          TEXT_RESILIENCE_MODE: report
          FOCUS_OBSCURED_MODE: enforce
          QA_ONLY_ROUTES: ${{ steps.lane.outputs.lane == 'content' && steps.lane.outputs.routes || steps.sel.outputs.routes }}
          REFLOW_DETAIL_ROTATION: '7'
          # Igual en las 8 shards de un run; la elige el job rotation (en main, la menos reciente).
          REFLOW_ROTATION_DAY: ${{ needs.rotation.outputs.slot }}
          SHARD_TOTAL: '8'
          SHARD_INDEX: ${{ matrix.shard }}
        timeout-minutes: 70
        run: node qa/sitewide-reflow-browser.mjs

      - name: Enforce F.2 text-resilience findings
        if: steps.sel.outputs.run == 'true'
        env:
          TEXT_RESILIENCE_GATE_MODE: enforce
        run: node qa/text-resilience-report-gate.mjs

      - name: Books index visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/books-index-design-browser.mjs

      - name: Manecillas visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/manecillas-design-browser.mjs

      - name: Manecillas Fragmentos visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/manecillas-fragmentos-design-browser.mjs

      - name: Manecillas scope isolation (main vs Fragmentos)
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
        run: node qa/manecillas-scope-isolation.mjs

      - name: Samuel visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/samuel-design-browser.mjs

      - name: Samuel fragmento visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/samuel-fragmento-design-browser.mjs

      - name: Metric-matched fallback fonts keep the webfont width
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
        run: node qa/font-fallback-width-browser.mjs

      - name: Noveris world-archive visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/noveris-design-browser.mjs

      - name: Samuel reading-club visual-system QA
        if: matrix.shard == 0 && steps.sel.outputs.run == 'true'
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_OUT: artifacts/sitewide-reflow
        run: node qa/club-samuel-design-browser.mjs

      - name: POV distribution format QA (O.2)
        if: always() && matrix.shard == 0 && steps.sel.outputs.run == 'true'
        run: node qa/pov-distribucion-format-browser.mjs

      - name: New base tools QA (O.1)
        if: always() && matrix.shard == 0 && steps.sel.outputs.run == 'true'
        run: node qa/o1-new-tools-browser.mjs

      - name: Save server log
        if: always() && steps.sel.outputs.run == 'true'
        run: |
          mkdir -p artifacts/sitewide-reflow
          cp /tmp/reflow-server.log artifacts/sitewide-reflow/server-${{ matrix.shard }}.log || true

      - name: Upload artifacts
        if: always() && steps.sel.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sitewide-reflow-qa-${{ matrix.shard }}
          path: artifacts/sitewide-reflow/
          if-no-files-found: warn
          retention-days: 14

  # Contexto requerido por el ruleset de main: siempre existe y solo es verde
  # si TODOS los fragmentos terminaron en verde (omitidos por el selector = verde).
  reflow-sitewide:
    needs: reflow-shard
    # Aggregate failed shards, but do not retain the concurrency slot after
    # the entire obsolete workflow has been cancelled by a newer candidate.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        env:
          RESULT: ${{ needs.reflow-shard.result }}
        run: |
          echo "reflow-shard: $RESULT"
          [ "$RESULT" = "success" ]
