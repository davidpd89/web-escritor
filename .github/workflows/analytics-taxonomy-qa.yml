name: Analytics taxonomy QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check analytics event taxonomy contract
        run: python scripts/check-analytics-taxonomy.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run analytics taxonomy browser QA
        run: node qa/analytics-taxonomy-browser.mjs
