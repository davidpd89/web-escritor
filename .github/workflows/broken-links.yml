name: Check external links

on:
  pull_request:
    paths:
      - '**/*.html'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Two flags about the CI runner, not about the links (2026-10-06): lychee's
      # own user agent gets challenged -- Blogspot URLs came back as six 302s
      # into google.com/sorry and Shopify answered 429 -- while the exact same
      # URLs return 200 from a normal browser. The UA stops most of that
      # happening at all; accepting 429 covers the rest, because a rate-limit
      # answer still proves the host resolved and served this path. Broken links
      # (404/410/DNS) are untouched and still fail the job.
      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          jobSummary: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
            --accept '200..=299,429'
            --root-dir "$(pwd)"
            --index-files 'index.html,.'
            --cache-exclude-status '429,500..=599'
            --max-retries 5
            --retry-wait-time 4
            --timeout 45
            --host-concurrency 1
            --host-request-interval 750ms
            --max-concurrency 8
            --method get
            --exclude-path '(^|/)scripts/'
            --exclude-path '(^|/)tests/'
            './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: broken-links-report
          path: lychee/out.md
          retention-days: 30
