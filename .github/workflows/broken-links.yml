name: Check external links

on:
  pull_request:
    paths:
      - '**/*.html'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          jobSummary: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --root-dir "$(pwd)"
            --index-files 'index.html,.'
            --cache-exclude-status '429,500..=599'
            --max-retries 4
            --retry-wait-time 2
            --timeout 25
            --host-concurrency 2
            --host-request-interval 250ms
            --max-concurrency 32
            --method get
            --exclude-path '(^|/)scripts/'
            --exclude-path '(^|/)tests/'
            './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broken-links-report
          path: lychee/out.md
          retention-days: 30
