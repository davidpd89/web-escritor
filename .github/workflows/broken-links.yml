name: Check external links

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/recheck-link-timeouts.py'
      - 'tests/test-link-timeout-recheck.py'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/recheck-link-timeouts.py'
      - 'tests/test-link-timeout-recheck.py'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  scan-links:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      lychee: ${{ steps.lychee.outcome }}
      recheck: ${{ steps.recheck.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Two flags about the CI runner, not about the links (2026-10-06): lychee's
      # own user agent gets challenged -- Blogspot URLs came back as six 302s
      # into google.com/sorry and Shopify answered 429 -- while the exact same
      # URLs return 200 from a normal browser. The UA stops most of that
      # happening at all; accepting 429 covers the rest, because a rate-limit
      # answer still proves the host resolved and served this path. Broken links
      # (404/410/DNS) are untouched and still fail the job.
      - name: Check links with Lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          jobSummary: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
            --accept '200..=299,429'
            --root-dir "$(pwd)"
            --index-files 'index.html,.'
            --cache-exclude-status '429,500..=599'
            --max-retries 5
            --retry-wait-time 4
            --timeout 45
            --host-concurrency 1
            --host-request-interval 750ms
            --max-concurrency 8
            --method get
            --exclude-path '(^|/)scripts/'
            --exclude-path '(^|/)tests/'
            './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Independently verify transient network/server failures
        id: recheck
        if: steps.lychee.outcome == 'failure'
        continue-on-error: true
        run: python3 scripts/recheck-link-timeouts.py --report lychee/out.md --output lychee/timeout-recheck.json

      - name: Upload report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: broken-links-report
          path: lychee/
          retention-days: 30

  alternate-network-recheck:
    # Some official sites refuse connections from the Linux runner network.
    # Verify the SAME URLs from another runner; still require real HTTP 2xx.
    needs: scan-links
    if: needs.scan-links.outputs.recheck == 'failure'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: broken-links-report
          path: lychee
      - name: Require successful responses for transient failures
        run: python scripts/recheck-link-timeouts.py --report lychee/out.md --output lychee/alternate-network-recheck.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: broken-links-alternate-network
          path: lychee/alternate-network-recheck.json
          retention-days: 30

  check-links:
    needs: [scan-links, alternate-network-recheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require scan and independently verified links
        env:
          SCAN_RESULT: ${{ needs.scan-links.result }}
          LYCHEE_RESULT: ${{ needs.scan-links.outputs.lychee }}
          RECHECK_RESULT: ${{ needs.scan-links.outputs.recheck }}
          ALTERNATE_RESULT: ${{ needs.alternate-network-recheck.result }}
        run: |
          test "$SCAN_RESULT" = success
          if [ "$LYCHEE_RESULT" = success ] || [ "$RECHECK_RESULT" = success ] || [ "$ALTERNATE_RESULT" = success ]; then
            echo 'Links verified with successful HTTP responses.'
          else
            echo 'Unverified or broken links remain.'
            exit 1
          fi
