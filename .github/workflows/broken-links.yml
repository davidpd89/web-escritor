name: Check external links

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/recheck-link-timeouts.py'
      - 'tests/test-link-timeout-recheck.py'
      - '.linkcheck-quarantine.json'
      - 'tests/test-link-check-budget.py'
      - 'scripts/select-link-check-inputs.py'
      - 'tests/test-link-input-selection.py'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/recheck-link-timeouts.py'
      - 'tests/test-link-timeout-recheck.py'
      - '.linkcheck-quarantine.json'
      - 'tests/test-link-check-budget.py'
      - 'scripts/select-link-check-inputs.py'
      - 'tests/test-link-input-selection.py'
      - '.lycheeignore'
      - '.github/workflows/broken-links.yml'
  schedule:
    - cron: '0 2 * * 1'  # Lunes, 03:00 en Madrid (CET): de madrugada
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Check the full site instead of changed HTML (main/schedules already check all)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # En una PR, un push nuevo cancela la CI del commit anterior; main y los programados no se cancelan.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
          fetch-depth: 0

      - name: Select all changed pages or the full scheduled audit
        id: scope
        run: python3 scripts/select-link-check-inputs.py

      # Covers in the external store (data/reading-covers-store.json) are not in this repo: the deploy rewrites
      # their logical /assets/reading-covers/ paths to the store URL. Do the same here so lychee checks the real
      # hosted file instead of reporting a missing local one.
      - name: Point store covers at the store, as the deploy does
        if: steps.scope.outputs.skip != 'true'
        run: python3 scripts/reading_cover_store.py apply .

      # Two flags about the CI runner, not about the links (2026-10-06): lychee's
      # own user agent gets challenged -- Blogspot URLs came back as six 302s
      # into google.com/sorry and Shopify answered 429 -- while the exact same
      # URLs return 200 from a normal browser. The UA stops most of that
      # happening at all; accepting 429 covers the rest, because a rate-limit
      # answer still proves the host resolved and served this path. Broken links
      # (404/410/DNS) are untouched and still fail the job.
      #
      # Retry budget (2026-11-04): a dead host costs --timeout x (1 + retries).
      # With 5 retries each of the ~32 weekly timeouts burned ~4.5 min of a
      # worker, pushing the full scan to 36-40+ min against the 40 min job
      # limit (PR scans got cancelled). Timeouts/5xx/transport errors are
      # rechecked with curl in the next step, which still demands a 2xx, so
      # 2 retries here lose no coverage. tests/test-link-check-budget.py.
      # 26/11 (carga 45868423421): sin HTML nuevo, cambiado ni borrado no hay enlace que pueda haberse roto; antes
      # se revisaba la web entera (9.482 páginas), el job agotaba sus 40 min y la carga salía roja.
      - name: Check links with Lychee
        id: lychee
        if: steps.scope.outputs.skip != 'true'
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          jobSummary: true
          format: markdown
          output: lychee/out.md
          args: >-
            --verbose
            --no-progress
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
            --accept '200..=299,429'
            --root-dir "$(pwd)"
            --index-files 'index.html,.'
            --cache-exclude-status '429,500..=599'
            --max-retries 2
            --retry-wait-time 4
            --timeout 45
            --host-concurrency 1
            --host-request-interval 750ms
            --max-concurrency 8
            --method get
            --exclude-path '(^|/)scripts/'
            --exclude-path '(^|/)tests/'
            ${{ steps.scope.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Independently verify transient network/server failures
        if: steps.lychee.outcome == 'failure'
        env:
          # En dispatch (el publicador de la carga lo lanza así sobre su rama) github.base_ref va vacío y se perdía
          # la regla de #1430: un host externo caído que ya estaba en main solo avisa. Fuera de main se compara con main.
          BASE_REF: ${{ github.base_ref || (github.ref_name != 'main' && 'main' || '') }}
          RECHECK_PAUSE: '120'  # segundo repaso de externos caídos: la red del runner falla a ratos
          # 18/11: en push a main fallaba por hosts ajenos al push (000 aleatorio). Se compara con el commit anterior:
          # solo un enlace que trae el propio push es fatal. El programado semanal sigue siendo estricto.
          PUSH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=${BASE_REF:+origin/$BASE_REF}
          case "$PUSH_BASE" in ''|0000000000000000000000000000000000000000) ;; *) git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null && base=$PUSH_BASE ;; esac
          python3 scripts/recheck-link-timeouts.py --report lychee/out.md --output lychee/timeout-recheck.json --quarantine .linkcheck-quarantine.json ${base:+--base-ref "$base"}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: broken-links-report
          path: lychee/
          retention-days: 30
