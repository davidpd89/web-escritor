# CodeQL (gratis en repositorios públicos): fallos y código inseguro en Python, JS y workflows.
# No usa el «default setup» porque ese corre en cada PR de datos de los robots y satura la cola de Actions:
# aquí solo cuando cambia código, y una pasada semanal completa de madrugada.
name: CodeQL

on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'qa/**', 'tests/**', 'assets/js/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['scripts/**', 'qa/**', 'assets/js/**', '.github/workflows/**']
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/no usadas/
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - recomendaciones
              - pagefind
              - data
              - node_modules
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
