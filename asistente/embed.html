<!DOCTYPE html>
<html lang="es" class="v1">
<head>
  <meta charset="UTF-8" />
  <base target="_top" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Asistente — David Porto Díaz</title>
  <link rel="stylesheet" href="/assets/v1-fonts.css?v=1" />
  <link rel="stylesheet" href="/assets/v1-tokens.css?v=1" />
  <link rel="stylesheet" href="/assets/v1-base.css?v=1" />
  <link rel="stylesheet" href="/assets/v1-components.css?v=3" />
  <link rel="stylesheet" href="/assets/assistant.css?v=1" />
  <link rel="stylesheet" href="/assets/assistant-embed.css?v=2" />
</head>
<body class="assistant-embed">
  <main class="assistant-chat" aria-label="Chat con el asistente">
    <section class="assistant-chat__log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversación" data-assistant-log>
      <article class="assistant-message assistant-message--assistant">
        <div class="assistant-message__bubble">
          <p>Hola. Puedo ayudarte a encontrar libros, fragmentos, Noveris, herramientas, editoriales, eventos o información sobre David. ¿Qué buscas?</p>
        </div>
      </article>
    </section>

    <div class="assistant-starters" aria-label="Preguntas sugeridas" data-assistant-starters>
      <button type="button" class="assistant-example" data-assistant-example="¿Qué puedo encontrar en esta web?">¿Qué puedo encontrar?</button>
      <button type="button" class="assistant-example" data-assistant-example="¿Qué libros ha publicado David Porto Díaz?">¿Qué libros hay?</button>
      <button type="button" class="assistant-example" data-assistant-example="¿Qué herramientas gratuitas hay para escritores?">Herramientas para escritores</button>
    </div>

    <form class="assistant-composer" data-assistant-form>
      <label class="sr-only" for="assistant-query">Escribe tu pregunta</label>
      <div class="assistant-composer__row">
        <textarea id="assistant-query" name="query" rows="1" maxlength="500" required autocomplete="off" enterkeyhint="send" placeholder="Escribe tu pregunta…" data-assistant-query></textarea>
        <button class="assistant-send" type="submit" data-assistant-submit aria-label="Enviar pregunta" title="Enviar">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 14-7-4 14-3-5-7-2Zm7 2 3-5"/></svg>
        </button>
        <button class="assistant-stop" type="button" data-assistant-stop hidden aria-label="Detener respuesta" title="Detener">
          <span aria-hidden="true"></span>
        </button>
      </div>
      <p class="assistant-status" role="status" aria-live="polite" data-assistant-status></p>
      <div class="assistant-turnstile" data-assistant-turnstile aria-hidden="true"></div>
    </form>
  </main>
  <script type="module" src="/assets/assistant-embed.js?v=1"></script>
  <script type="module" src="/assets/assistant.js?v=1"></script>
</body>
</html>
