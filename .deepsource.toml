version = 1

# Espejo de los analizadores activos en la UI de DeepSource (P0-8, .ci/fable-direccion-2026-11-15.md).
# - El JS mezcla scripts clásicos (assets/) y módulos ES: module_system = "es-modules".
# - **/*.mjs fuera: 337 scripts de QA y tests usan await de nivel superior (ES2022) y el parser de DeepSource
#   no lo admite; los daba como «Parsing error: 'import' and 'export' may appear only with sourceType: module».
#   Siguen revisados por SonarCloud y CodeQL (javascript-typescript) en cada PR.
# - pagefind/ es generado (DeepSource lo salta igualmente por exceso de avisos).
# - Complejidad: el umbral no silenció pasada (57) ni reparar (18) en #1339; las funciones heredadas llevan
#   skipcq: PY-R1000 / JS-R1005 con referencia a la orden P2-1 (refactor con hash idéntico). Lo nuevo se mide.

test_patterns = ["tests/**"]
exclude_patterns = ["**/*.mjs", "pagefind/**"]

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"
  cyclomatic_complexity_threshold = "critical"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "secrets"
