version = 1

# Espejo de los analizadores activos en la UI. El JS del repo mezcla scripts clásicos (assets/)
# y módulos ES (qa/*.mjs, scripts/*.mjs): sin module_system, cada .mjs daba
# «Parsing error: 'import' and 'export' may appear only with 'sourceType: module'».

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "secrets"
